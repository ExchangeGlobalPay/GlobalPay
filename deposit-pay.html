<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GlobalPay - Deposit</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{
  background:#0b1220;color:#fff;min-height:100vh;
  display:flex;justify-content:center;padding:25px 15px
}
.box{
  width:100%;max-width:430px;background:#111827;
  border:1px solid #263244;border-radius:20px;padding:22px;
}
.logo{text-align:center;color:#8b5cf6;font-size:28px;font-weight:800}
.sub{text-align:center;color:#94a3b8;margin:5px 0 20px}
.amount{
  background:#1e293b;border-radius:14px;text-align:center;padding:18px;
  margin-bottom:18px
}
.amount small{color:#94a3b8}
.amount h1{margin-top:6px}
.qr{
  width:220px;height:220px;background:#fff;border-radius:14px;
  padding:10px;margin:0 auto 18px
}
.qr img{width:100%;height:100%;object-fit:contain}
.info{
  background:#172033;border-radius:13px;padding:15px;
  color:#cbd5e1;line-height:1.55;margin-bottom:18px
}
label{display:block;margin-bottom:7px;color:#d1d5db}
input{
  width:100%;padding:15px;background:#0f172a;
  border:1px solid #374151;border-radius:11px;color:white;
  font-size:16px;outline:none
}
button{
  width:100%;padding:15px;margin-top:14px;border:0;
  border-radius:11px;background:#8b5cf6;color:white;
  font-size:16px;font-weight:700
}
button:disabled{opacity:.5}
.back{background:#273449}

#msg{
  margin-top:14px;padding:12px;border-radius:10px;
  text-align:center;display:none
}
.err{display:block!important;background:#451a1a;color:#fecaca}
.ok{display:block!important;background:#12351f;color:#bbf7d0}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  display:none;align-items:center;justify-content:center;padding:20px;
  z-index:99
}
.modal.show{display:flex}
.card{
  width:100%;max-width:390px;background:#111827;
  border:1px solid #334155;border-radius:20px;padding:22px
}
.status{
  text-align:center;color:#fbbf24;font-size:22px;font-weight:800;
  margin-bottom:18px
}
.row{
  display:flex;justify-content:space-between;gap:15px;
  padding:11px 0;border-bottom:1px solid #263244
}
.row span{color:#94a3b8}
.row b{text-align:right;word-break:break-all}
.pending{
  color:#fbbf24
}
.success{
  color:#4ade80
}
.close{
  background:#334155
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">GLOBAL PAY</div>
  <div class="sub">Secure Deposit</div>

  <div class="amount">
    <small>Deposit Amount</small>
    <h1 id="amount">₹0</h1>
  </div>

  <div class="qr">
    <img src="qr.png" alt="QR">
  </div>

  <div class="info">
    <b>Payment Instructions</b><br><br>
    QR scan karke exact amount pay karein.<br>
    Payment complete hone ke baad 12-digit UTR enter karein.
  </div>

  <label>12-Digit UTR Number</label>

  <input
    id="utr"
    inputmode="numeric"
    maxlength="12"
    placeholder="Enter 12-digit UTR"
  >

  <button id="submitBtn" disabled>
    Checking Login...
  </button>

  <button class="back" onclick="location.href='deposit.html'">
    Back
  </button>

  <div id="msg"></div>

</div>


<!-- PENDING / SUCCESS POPUP -->

<div class="modal" id="modal">

  <div class="card">

    <div id="statusTitle" class="status pending">
      PAYMENT PENDING
    </div>

    <div class="row">
      <span>Amount</span>
      <b id="popAmount">₹0</b>
    </div>

    <div class="row">
      <span>UTR</span>
      <b id="popUtr">-</b>
    </div>

    <div class="row">
      <span>Date</span>
      <b id="popDate">-</b>
    </div>

    <div class="row">
      <span>Time</span>
      <b id="popTime">-</b>
    </div>

    <div class="row">
      <span>Status</span>
      <b id="popStatus" class="pending">
        Pending
      </b>
    </div>

    <button class="close" id="closeBtn">
      Close
    </button>

  </div>
</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
  apiKey:"AIzaSyCA6csT8NBPNwOyA269hOfdgmt9DYDoqQ",
  authDomain:"globalpay-d31dd.firebaseapp.com",
  projectId:"globalpay-d31dd",
  storageBucket:"globalpay-d31dd.firebasestorage.app",
  messagingSenderId:"862227027913",
  appId:"1:862227027913:web:f643dc5cb4b014fd80ba18"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const amountEl=document.getElementById("amount");
const utrEl=document.getElementById("utr");
const submitBtn=document.getElementById("submitBtn");
const msg=document.getElementById("msg");

const modal=document.getElementById("modal");
const closeBtn=document.getElementById("closeBtn");

const popAmount=document.getElementById("popAmount");
const popUtr=document.getElementById("popUtr");
const popDate=document.getElementById("popDate");
const popTime=document.getElementById("popTime");
const popStatus=document.getElementById("popStatus");
const statusTitle=document.getElementById("statusTitle");


const params=new URLSearchParams(location.search);
const amount=Number(params.get("amount"));

if(!Number.isFinite(amount) || amount<300 || amount>100000){
  amountEl.textContent="Invalid";
  submitBtn.disabled=true;
}else{
  amountEl.textContent="₹"+amount.toLocaleString("en-IN");
}


let currentUser=null;

onAuthStateChanged(auth,user=>{

  currentUser=user||null;

  if(currentUser){
    submitBtn.disabled=false;
    submitBtn.textContent="Submit Payment";
  }else{
    submitBtn.disabled=true;
    submitBtn.textContent="Login Required";

    msg.textContent="Login session nahi mila.";
    msg.className="err";
  }

});


utrEl.addEventListener("input",()=>{
  utrEl.value=utrEl.value.replace(/\D/g,"").slice(0,12);
});


function showMsg(text,ok=false){
  msg.textContent=text;
  msg.className=ok?"ok":"err";
}


function showPendingPopup(id,createdDate){

  popAmount.textContent="₹"+amount.toLocaleString("en-IN");
  popUtr.textContent=utrEl.value;

  const d=createdDate||new Date();

  popDate.textContent=d.toLocaleDateString("en-IN");
  popTime.textContent=d.toLocaleTimeString("en-IN");

  popStatus.textContent="Pending";
  popStatus.className="pending";

  statusTitle.textContent="PAYMENT PENDING";
  statusTitle.className="status pending";

  modal.classList.add("show");


  /*
    Admin confirmation ke baad Firestore document change hoga.
    onSnapshot us change ko realtime detect karega.
  */

  const requestRef=doc(
    db,
    "users",
    currentUser.uid,
    "depositRequests",
    id
  );


  onSnapshot(requestRef,snap=>{

    if(!snap.exists()) return;

    const data=snap.data();

    if(data.status==="confirmed"){

      popStatus.textContent="Successfully Confirmed";
      popStatus.className="success";

      statusTitle.textContent="PAYMENT SUCCESSFUL";
      statusTitle.className="status success";

      showMsg(
        "Deposit successfully confirmed.",
        true
      );

    }

    if(data.status==="rejected"){

      popStatus.textContent="Rejected";
      popStatus.className="err";

      statusTitle.textContent="PAYMENT REJECTED";
      statusTitle.className="status";
    }

  });

}


submitBtn.addEventListener("click",async()=>{

  if(!currentUser){
    showMsg("Please login first.");
    return;
  }

  const utr=utrEl.value.trim();

  if(!/^\d{12}$/.test(utr)){
    showMsg("Exactly 12-digit UTR enter karein.");
    return;
  }

  submitBtn.disabled=true;
  submitBtn.textContent="Submitting...";

  try{

    const now=new Date();

    const ref=await addDoc(
      collection(
        db,
        "users",
        currentUser.uid,
        "depositRequests"
      ),
      {
        uid:currentUser.uid,
        amount:amount,
        utr:utr,
        status:"pending",
        tokens:0,
        createdAt:serverTimestamp(),
        submittedAt:now.toISOString()
      }
    );


    showMsg(
      "Deposit request pending hai.",
      true
    );

    showPendingPopup(ref.id,now);

    submitBtn.textContent="Request Submitted";

    utrEl.disabled=true;


  }catch(e){

    console.error(e);

    submitBtn.disabled=false;
    submitBtn.textContent="Submit Payment";

    showMsg(
      e.code==="permission-denied"
      ? "Firestore permission denied."
      : "Request submit nahi ho saki."
    );

  }

});


closeBtn.addEventListener("click",()=>{
  modal.classList.remove("show");
});

</script>

</body>
  </html>
