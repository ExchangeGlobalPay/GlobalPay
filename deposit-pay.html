<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Global Pay - Payment</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .payment-box {
      width: 100%;
      max-width: 430px;
      background: #111827;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    }

    .title {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 22px;
    }

    .amount-box {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 18px;
    }

    .amount-label {
      color: #94a3b8;
      font-size: 14px;
    }

    .amount {
      font-size: 30px;
      font-weight: bold;
      margin-top: 5px;
    }

    .qr-box {
      background: white;
      padding: 12px;
      border-radius: 12px;
      width: 220px;
      height: 220px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .timer {
      text-align: center;
      color: #facc15;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    .success {
      color: #22c55e;
    }

    .error {
      color: #ef4444;
    }

    .info {
      color: #94a3b8;
    }

    .note {
      margin-top: 18px;
      padding: 12px;
      background: #1e293b;
      border-radius: 10px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .popup-content {
      width: 100%;
      max-width: 360px;
      background: #111827;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
    }

    .popup-content h2 {
      margin-bottom: 10px;
    }

    .popup-content p {
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .close-btn {
      background: #8b5cf6;
    }
  </style>
</head>

<body>

  <div class="payment-box">

    <div class="title">GLOBAL PAY</div>
    <div class="subtitle">Complete Your Payment</div>

    <div class="amount-box">
      <div class="amount-label">Payment Amount</div>
      <div class="amount" id="amount">₹0</div>
    </div>

    <div class="qr-box">
      <img src="qr.png" alt="Payment QR Code">
    </div>

    <div class="timer">
      Payment Time: <span id="timer">05:00</span>
    </div>

    <label for="utr">Enter 12-Digit UTR Number</label>

    <input
      type="text"
      id="utr"
      inputmode="numeric"
      maxlength="12"
      placeholder="Enter UTR number"
      autocomplete="off"
    >

    <button id="submitBtn">
      Submit Payment
    </button>

    <div id="message" class="message info"></div>

    <div class="note">
      After completing the payment, enter the 12-digit UTR number
      and click Submit Payment. Your payment request will be reviewed
      by the administrator.
    </div>

  </div>

  <div class="popup" id="popup">
    <div class="popup-content">
      <h2 id="popupTitle">Payment Submitted</h2>
      <p id="popupText">
        Your payment request has been submitted successfully.
      </p>
      <button class="close-btn" onclick="closePopup()">OK</button>
    </div>
  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      initializeAuth,
      indexedDBLocalPersistence,
      browserLocalPersistence,
      inMemoryPersistence,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp,
      doc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyCA6csT8NBPNwOyA269hOfdgmt9DYDoqQ",
      authDomain: "globalpay-d31dd.firebaseapp.com",
      projectId: "globalpay-d31dd",
      storageBucket: "globalpay-d31dd.firebasestorage.app",
      messagingSenderId: "862227027913",
      appId: "1:862227027913:web:f643dc5cb4b014fd80ba18"
    };


    const app = initializeApp(firebaseConfig);

    const auth = initializeAuth(app, {
      persistence: [
        indexedDBLocalPersistence,
        browserLocalPersistence,
        inMemoryPersistence
      ]
    });

    const db = getFirestore(app);


    /* =========================
       PAGE ELEMENTS
    ========================= */

    const amountElement = document.getElementById("amount");
    const utrInput = document.getElementById("utr");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    const timerElement = document.getElementById("timer");

    const popup = document.getElementById("popup");
    const popupTitle = document.getElementById("popupTitle");
    const popupText = document.getElementById("popupText");


    /* =========================
       GET PAYMENT AMOUNT
    ========================= */

    const urlParams = new URLSearchParams(window.location.search);

    let amount = Number(urlParams.get("amount")) || 0;

    amountElement.textContent =
      "₹" + amount.toLocaleString("en-IN");


    /* =========================
       AUTH SESSION
    ========================= */

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {

      currentUser = user || null;

    });


    /* =========================
       UTR INPUT
    ========================= */

    utrInput.addEventListener("input", () => {

      utrInput.value = utrInput.value
        .replace(/\D/g, "")
        .slice(0, 12);

    });


    /* =========================
       TIMER
    ========================= */

    let remainingSeconds = 5 * 60;

    const timerInterval = setInterval(() => {

      const minutes =
        Math.floor(remainingSeconds / 60);

      const seconds =
        remainingSeconds % 60;

      timerElement.textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

      if (remainingSeconds <= 0) {

        clearInterval(timerInterval);

        timerElement.textContent = "Expired";

      }

      remainingSeconds--;

    }, 1000);


    /* =========================
       SUBMIT PAYMENT
    ========================= */

    submitBtn.addEventListener("click", async () => {

      const utr = utrInput.value.trim();

      message.textContent = "";
      message.className = "message";


      if (!amount || amount <= 0) {

        message.textContent =
          "Invalid payment amount.";

        message.className =
          "message error";

        return;
      }


      if (!/^\d{12}$/.test(utr)) {

        message.textContent =
          "Please enter a valid 12-digit UTR number.";

        message.className =
          "message error";

        return;
      }


      /*
        Wait until Firebase finishes restoring
        the existing login session.
      */

      try {

        await auth.authStateReady();

      } catch (error) {

        console.log(error);

      }


      currentUser = auth.currentUser;


      /*
        Firebase authentication is required by
        Firestore security rules.

        We do NOT show "Login Required".
      */

      if (!currentUser) {

        message.textContent =
          "Please refresh the page and try again.";

        message.className =
          "message error";

        return;
      }


      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";


      try {

        const requestRef = await addDoc(
          collection(
            db,
            "users",
            currentUser.uid,
            "depositRequests"
          ),
          {
            uid: currentUser.uid,
            amount: amount,
            utr: utr,
            status: "pending",
            tokens: 0,
            createdAt: serverTimestamp(),
            submittedAt: new Date().toISOString()
          }
        );


        message.textContent =
          "Payment request submitted successfully.";

        message.className =
          "message success";


        popupTitle.textContent =
          "Payment Submitted";

        popupText.textContent =
          "Your payment request has been submitted successfully and is now pending admin verification.";

        popup.style.display = "flex";


        /*
          Listen for admin confirmation/rejection.
        */

        onSnapshot(
          doc(
            db,
            "users",
            currentUser.uid,
            "depositRequests",
            requestRef.id
          ),
          (snapshot) => {

            if (!snapshot.exists()) return;

            const data = snapshot.data();


            if (data.status === "confirmed") {

              popupTitle.textContent =
                "Payment Confirmed";

              popupText.textContent =
                "Your payment has been confirmed successfully.";

              popup.style.display = "flex";

              message.textContent =
                "Payment confirmed successfully.";

              message.className =
                "message success";

            }


            if (data.status === "rejected") {

              popupTitle.textContent =
                "Payment Rejected";

              popupText.textContent =
                "Your payment request was rejected by the administrator.";

              popup.style.display = "flex";

              message.textContent =
                "Payment request rejected.";

              message.className =
                "message error";

            }

          }
        );


        submitBtn.textContent =
          "Payment Submitted";


      } catch (error) {

        console.error(error);

        message.textContent =
          "Unable to submit payment. Please try again.";

        message.className =
          "message error";

        submitBtn.disabled = false;

        submitBtn.textContent =
          "Submit Payment";

      }

    });


    /* =========================
       CLOSE POPUP
    ========================= */

    window.closePopup = function () {

      popup.style.display = "none";

    };

  </script>

</body>
  </html>
