<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GlobalPay - Deposit Payment</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1220;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #111827;
      border: 1px solid #263244;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: #8b5cf6;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .amount-box {
      background: #1e293b;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      margin-bottom: 18px;
    }

    .amount-label {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .amount {
      font-size: 30px;
      font-weight: 800;
      color: #fff;
    }

    .timer-box {
      text-align: center;
      margin-bottom: 18px;
    }

    .timer-label {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 5px;
    }

    #timer {
      font-size: 24px;
      font-weight: 700;
      color: #f59e0b;
    }

    .qr-box {
      background: #fff;
      padding: 12px;
      border-radius: 14px;
      width: 220px;
      height: 220px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .instruction {
      background: #172033;
      border-radius: 12px;
      padding: 13px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .instruction strong {
      color: #fff;
    }

    label {
      display: block;
      font-size: 14px;
      color: #d1d5db;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      outline: none;
      margin-bottom: 14px;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #8b5cf6;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .back-btn {
      margin-top: 10px;
      background: #273449;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    .success {
      display: block !important;
      background: #12351f;
      color: #86efac;
      border: 1px solid #166534;
    }

    .error {
      display: block !important;
      background: #3a1717;
      color: #fca5a5;
      border: 1px solid #991b1b;
    }

    .checking {
      display: block !important;
      background: #172033;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">GLOBAL PAY</div>
    <div class="subtitle">Secure Deposit Payment</div>

    <div class="amount-box">
      <div class="amount-label">Deposit Amount</div>
      <div class="amount" id="amount">₹0</div>
    </div>

    <div class="timer-box">
      <div class="timer-label">Payment Window</div>
      <div id="timer">05:00</div>
    </div>

    <div class="qr-box">
      <img src="qr.png" alt="Payment QR Code">
    </div>

    <div class="instruction">
      <strong>Payment Instructions</strong><br><br>
      1. QR code scan karke exact amount pay karein.<br>
      2. Payment complete hone ke baad apna <strong>12-digit UTR</strong> neeche enter karein.<br>
      3. Submit karne ke baad request admin verification ke liye pending rahegi.
    </div>

    <label for="utr">12-Digit UTR Number</label>

    <input
      type="text"
      id="utr"
      placeholder="Enter 12-digit UTR"
      inputmode="numeric"
      maxlength="12"
      autocomplete="off"
    >

    <button id="submitBtn" disabled>
      Checking Login...
    </button>

    <button
      class="back-btn"
      onclick="window.location.href='deposit.html'">
      Back
    </button>

    <div id="message"></div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      initializeAuth,
      browserLocalPersistence,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =========================================
    // FIREBASE CONFIG
    // =========================================

    const firebaseConfig = {
      apiKey: "AIzaSyCA6csT8NBPNwOyA269hOfdgmt9DYDoqQ",
      authDomain: "globalpay-d31dd.firebaseapp.com",
      projectId: "globalpay-d31dd",
      storageBucket: "globalpay-d31dd.firebasestorage.app",
      messagingSenderId: "862227027913",
      appId: "1:862227027913:web:f643dc5cb4b014fd80ba18"
    };


    const app = initializeApp(firebaseConfig);

    const auth = initializeAuth(app, {
      persistence: browserLocalPersistence
    });

    const db = getFirestore(app);


    // =========================================
    // ELEMENTS
    // =========================================

    const amountElement = document.getElementById("amount");
    const utrInput = document.getElementById("utr");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    const timerElement = document.getElementById("timer");


    // =========================================
    // GET AMOUNT FROM URL
    // deposit-pay.html?amount=500
    // =========================================

    const params = new URLSearchParams(window.location.search);

    const amount = Number(params.get("amount"));


    if (
      !Number.isFinite(amount) ||
      amount < 300 ||
      amount > 100000
    ) {

      amountElement.textContent = "Invalid Amount";

      showMessage(
        "Deposit amount invalid hai. Please deposit page se dobara amount select karein.",
        "error"
      );

      submitBtn.disabled = true;

    } else {

      amountElement.textContent =
        "₹" + amount.toLocaleString("en-IN");

    }


    // =========================================
    // MESSAGE
    // =========================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className = "";

      if (type === "success") {
        message.classList.add("success");
      }

      if (type === "error") {
        message.classList.add("error");
      }

      if (type === "checking") {
        message.classList.add("checking");
      }
    }


    // =========================================
    // AUTH STATE
    // =========================================

    let currentUser = null;
    let authChecked = false;


    onAuthStateChanged(auth, (user) => {

      authChecked = true;

      currentUser = user || null;


      if (currentUser) {

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Payment";

        message.className = "";

      } else {

        submitBtn.disabled = true;
        submitBtn.textContent = "Login Required";

        showMessage(
          "Login session nahi mila. Please login karke dobara Deposit page open karein.",
          "error"
        );

      }

    });


    // =========================================
    // UTR INPUT
    // =========================================

    utrInput.addEventListener("input", () => {

      utrInput.value = utrInput.value
        .replace(/\D/g, "")
        .slice(0, 12);

    });


    // =========================================
    // SUBMIT
    // =========================================

    submitBtn.addEventListener("click", async () => {

      try {

        // Auth state ko dobara check karo
        currentUser = auth.currentUser || currentUser;


        if (!currentUser) {

          showMessage(
            "Login session nahi mila. Please login karke dobara try karein.",
            "error"
          );

          return;
        }


        if (
          !Number.isFinite(amount) ||
          amount < 300 ||
          amount > 100000
        ) {

          showMessage(
            "Invalid deposit amount.",
            "error"
          );

          return;
        }


        const utr = utrInput.value.trim();


        // 12 digit validation
        if (!/^\d{12}$/.test(utr)) {

          showMessage(
            "Please exactly 12-digit UTR number enter karein.",
            "error"
          );

          utrInput.focus();

          return;
        }


        // Disable button
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";


        showMessage(
          "Payment request submit ho rahi hai...",
          "checking"
        );


        // =====================================
        // FIRESTORE
        // =====================================

        await addDoc(
          collection(
            db,
            "users",
            currentUser.uid,
            "depositRequests"
          ),
          {
            uid: currentUser.uid,

            amount: amount,

            utr: utr,

            status: "pending",

            tokens: 0,

            createdAt: serverTimestamp(),

            submittedAt: new Date().toISOString()
          }
        );


        // =====================================
        // SUCCESS
        // =====================================

        showMessage(
          "Deposit request successfully submit ho gayi. Admin verification ke baad request process hogi.",
          "success"
        );

        utrInput.disabled = true;

        submitBtn.textContent = "Request Submitted";


        // 3 sec baad wallet par
        setTimeout(() => {

          window.location.href = "wallet.html";

        }, 3000);


      } catch (error) {

        console.error("Deposit Error:", error);


        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Payment";


        let errorText = "Request submit nahi ho saki.";


        if (error.code === "permission-denied") {

          errorText =
            "Firestore permission denied. Firebase login/rules check karein.";

        } else if (error.code === "unavailable") {

          errorText =
            "Network problem. Internet connection check karke dobara try karein.";

        } else if (error.message) {

          errorText = error.message;

        }


        showMessage(
          errorText,
          "error"
        );

      }

    });


    // =========================================
    // 5 MINUTE TIMER
    // =========================================

    let timeLeft = 5 * 60;


    function updateTimer() {

      const minutes =
        Math.floor(timeLeft / 60);

      const seconds =
        timeLeft % 60;


      timerElement.textContent =
        String(minutes).padStart(2, "0")
        + ":" +
        String(seconds).padStart(2, "0");


      if (timeLeft <= 0) {

        clearInterval(timerInterval);

        timerElement.textContent = "00:00";

        submitBtn.disabled = true;

        showMessage(
          "Payment window expire ho gaya. Deposit page se naya payment request start karein.",
          "error"
        );

        return;
      }


      timeLeft--;

    }


    updateTimer();

    const timerInterval =
      setInterval(updateTimer, 1000);

  </script>

</body>
  </html>
