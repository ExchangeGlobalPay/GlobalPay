<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Pay - Payment</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080b16;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.payment-box{
  width:100%;
  max-width:430px;
  background:linear-gradient(145deg,#111827,#0b1020);
  border:1px solid rgba(139,92,246,.25);
  border-radius:22px;
  padding:25px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.title{
  text-align:center;
  font-size:28px;
  font-weight:800;
  letter-spacing:1px;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin:8px 0 24px;
}

.amount-box{
  background:linear-gradient(135deg,#1e293b,#172033);
  border-radius:15px;
  padding:17px;
  text-align:center;
  margin-bottom:20px;
}

.amount-label{
  color:#94a3b8;
  font-size:13px;
}

.amount{
  font-size:32px;
  font-weight:800;
  margin-top:5px;
}

.qr-box{
  background:#fff;
  padding:12px;
  border-radius:16px;
  width:220px;
  height:220px;
  margin:0 auto 18px;
}

.qr-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.timer{
  text-align:center;
  color:#facc15;
  font-size:18px;
  font-weight:bold;
  margin-bottom:22px;
}

label{
  display:block;
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:15px;
  background:#080b16;
  color:#fff;
  border:1px solid #334155;
  border-radius:12px;
  outline:none;
  font-size:16px;
  margin-bottom:14px;
}

input:focus{
  border-color:#8b5cf6;
  box-shadow:0 0 0 3px rgba(139,92,246,.12);
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(109,40,217,.25);
}

button:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.message{
  text-align:center;
  min-height:20px;
  margin-top:15px;
  font-size:14px;
}

.success{color:#22c55e}
.error{color:#ef4444}

.note{
  margin-top:18px;
  padding:12px;
  border-radius:12px;
  background:#172033;
  color:#94a3b8;
  font-size:12px;
  line-height:1.5;
  text-align:center;
}

/* PREMIUM POPUP */

.popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(8px);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.popup-card{
  width:100%;
  max-width:380px;
  background:linear-gradient(145deg,#151b2e,#0b1020);
  border:1px solid rgba(139,92,246,.45);
  border-radius:24px;
  padding:30px 24px;
  text-align:center;
  box-shadow:0 25px 80px rgba(0,0,0,.65);
  animation:popupIn .35s ease;
}

@keyframes popupIn{
  from{
    transform:scale(.8);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.success-icon{
  width:70px;
  height:70px;
  margin:0 auto 18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(34,197,94,.12);
  border:2px solid #22c55e;
  color:#22c55e;
  font-size:35px;
}

.popup-card h2{
  font-size:24px;
  margin-bottom:8px;
}

.popup-card p{
  color:#94a3b8;
  line-height:1.5;
  margin-bottom:18px;
}

.demo-badge{
  display:inline-block;
  padding:7px 14px;
  border-radius:30px;
  background:rgba(250,204,21,.12);
  border:1px solid rgba(250,204,21,.35);
  color:#facc15;
  font-size:12px;
  font-weight:bold;
  margin-bottom:15px;
}

.token-box{
  background:#0b1222;
  border:1px solid rgba(139,92,246,.3);
  border-radius:15px;
  padding:17px;
  margin-bottom:20px;
}

.token-label{
  color:#94a3b8;
  font-size:13px;
}

.token-value{
  color:#a78bfa;
  font-size:30px;
  font-weight:800;
  margin-top:5px;
}

.close-btn{
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
}
</style>
</head>

<body>

<div class="payment-box">

  <div class="title">GLOBAL PAY</div>
  <div class="subtitle">Complete Your Payment</div>

  <div class="amount-box">
    <div class="amount-label">Payment Amount</div>
    <div class="amount" id="amount">₹0</div>
  </div>

  <div class="qr-box">
    <img src="qr.png" alt="Payment QR Code">
  </div>

  <div class="timer">
    Payment Time: <span id="timer">05:00</span>
  </div>

  <label for="utr">Enter 12-Digit UTR Number</label>

  <input
    id="utr"
    type="text"
    inputmode="numeric"
    maxlength="12"
    placeholder="Enter UTR number"
    autocomplete="off"
  >

  <button id="submitBtn">
    Submit Payment
  </button>

  <div id="message" class="message"></div>

  <div class="note">
    Enter the UTR number after completing your payment.
    Payment requests are subject to verification.
  </div>

</div>


<!-- PREMIUM DEMO POPUP -->

<div class="popup" id="popup">

  <div class="popup-card">

    <div class="success-icon">✓</div>

    <div class="demo-badge">
      DEMO MODE
    </div>

    <h2>Demo Payment Successful</h2>

    <p>
      The special demo UTR was recognized successfully.
    </p>

    <div class="token-box">

      <div class="token-label">
        Demo Tokens
      </div>

      <div class="token-value" id="demoTokens">
        0
      </div>

    </div>

    <button class="close-btn" onclick="closePopup()">
      Continue
    </button>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


const firebaseConfig = {
  apiKey: "AIzaSyCA6csT8NBPNwOyA269hOfdgmt9DYDoqQ",
  authDomain: "globalpay-d31dd.firebaseapp.com",
  projectId: "globalpay-d31dd",
  storageBucket: "globalpay-d31dd.firebasestorage.app",
  messagingSenderId: "862227027913",
  appId: "1:862227027913:web:f643dc5cb4b014fd80ba18"
};

initializeApp(firebaseConfig);


/* =========================
   SPECIAL DEMO UTR
========================= */

const DEMO_UTR = "827169204200";


/* =========================
   ELEMENTS
========================= */

const amountElement =
  document.getElementById("amount");

const utrInput =
  document.getElementById("utr");

const submitBtn =
  document.getElementById("submitBtn");

const message =
  document.getElementById("message");

const timerElement =
  document.getElementById("timer");

const popup =
  document.getElementById("popup");

const demoTokens =
  document.getElementById("demoTokens");


/* =========================
   AMOUNT
========================= */

const params =
  new URLSearchParams(window.location.search);

const amount =
  Number(params.get("amount")) || 0;

amountElement.textContent =
  "₹" + amount.toLocaleString("en-IN");


/* =========================
   UTR INPUT
========================= */

utrInput.addEventListener("input", () => {

  utrInput.value =
    utrInput.value
      .replace(/\D/g, "")
      .slice(0,12);

});


/* =========================
   TIMER
========================= */

let remainingSeconds = 300;

const timerInterval = setInterval(() => {

  const minutes =
    Math.floor(remainingSeconds / 60);

  const seconds =
    remainingSeconds % 60;

  timerElement.textContent =
    String(minutes).padStart(2,"0")
    + ":" +
    String(seconds).padStart(2,"0");

  if(remainingSeconds <= 0){

    clearInterval(timerInterval);

    timerElement.textContent =
      "Expired";

  }

  remainingSeconds--;

},1000);


/* =========================
   SUBMIT
========================= */

submitBtn.addEventListener("click", () => {

  const utr =
    utrInput.value.trim();


  message.textContent = "";
  message.className = "message";


  if(amount <= 0){

    message.textContent =
      "Invalid payment amount.";

    message.className =
      "message error";

    return;
  }


  if(!/^\d{12}$/.test(utr)){

    message.textContent =
      "Please enter a valid 12-digit UTR number.";

    message.className =
      "message error";

    return;
  }


  /* DEMO ONLY */

  if(utr === DEMO_UTR){

    demoTokens.textContent =
      amount.toLocaleString("en-IN");


    popup.style.display =
      "flex";


    message.textContent =
      "Demo payment processed successfully.";

    message.className =
      "message success";


    return;
  }


  message.textContent =
    "Payment submitted for verification.";

  message.className =
    "message success";

});


/* =========================
   CLOSE POPUP
========================= */

window.closePopup = function(){

  popup.style.display =
    "none";

};

</script>

</body>
  </html>
