<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Pay - Payment</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#050711;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.payment-box{
  width:100%;
  max-width:430px;
  background:linear-gradient(145deg,#12182a,#080d1b);
  border:1px solid rgba(139,92,246,.35);
  border-radius:22px;
  padding:25px;
  box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.title{
  text-align:center;
  font-size:28px;
  font-weight:800;
  letter-spacing:1px;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin:8px 0 24px;
}

.amount-box{
  background:#182235;
  border-radius:15px;
  padding:17px;
  text-align:center;
  margin-bottom:20px;
}

.amount-label{
  color:#94a3b8;
  font-size:13px;
}

.amount{
  font-size:32px;
  font-weight:800;
  margin-top:5px;
}

.qr-box{
  background:#fff;
  padding:12px;
  border-radius:16px;
  width:220px;
  height:220px;
  margin:0 auto 18px;
}

.qr-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.timer{
  text-align:center;
  color:#facc15;
  font-size:18px;
  font-weight:bold;
  margin-bottom:22px;
}

label{
  display:block;
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:15px;
  background:#070b16;
  color:#fff;
  border:1px solid #334155;
  border-radius:12px;
  outline:none;
  font-size:16px;
  margin-bottom:14px;
}

input:focus{
  border-color:#8b5cf6;
  box-shadow:0 0 0 3px rgba(139,92,246,.12);
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  text-align:center;
  min-height:20px;
  margin-top:15px;
  font-size:14px;
}

.success{
  color:#22c55e;
}

.error{
  color:#ef4444;
}

/* POPUP */

.popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.84);
  backdrop-filter:blur(9px);
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.popup-card{
  width:100%;
  max-width:390px;
  background:linear-gradient(145deg,#151c30,#080d1b);
  border:1px solid rgba(139,92,246,.5);
  border-radius:25px;
  padding:28px 22px;
  box-shadow:0 25px 90px rgba(0,0,0,.7);
  animation:popupIn .3s ease;
}

@keyframes popupIn{
  from{
    transform:scale(.82);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.success-icon{
  width:76px;
  height:76px;
  margin:0 auto 16px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(34,197,94,.12);
  border:3px solid #22c55e;
  color:#22c55e;
  font-size:42px;
  font-weight:bold;
  box-shadow:0 0 30px rgba(34,197,94,.2);
}

.popup-card h2{
  text-align:center;
  font-size:25px;
  margin-bottom:7px;
}

.popup-subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:20px;
}

.token-box{
  text-align:center;
  background:#090f1d;
  border:1px solid rgba(139,92,246,.4);
  border-radius:16px;
  padding:16px;
  margin-bottom:18px;
}

.token-label{
  color:#94a3b8;
  font-size:13px;
}

.token-value{
  color:#22c55e;
  font-size:30px;
  font-weight:800;
  margin-top:5px;
}

.details{
  background:#0d1424;
  border-radius:15px;
  padding:14px;
  margin-bottom:20px;
}

.detail{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid rgba(148,163,184,.1);
  font-size:13px;
}

.detail:last-child{
  border-bottom:0;
}

.detail span:first-child{
  color:#94a3b8;
}

.detail span:last-child{
  color:#fff;
  text-align:right;
  word-break:break-all;
}

.continue-btn{
  background:linear-gradient(135deg,#8b5cf6,#6d28d9);
}
</style>
</head>

<body>

<div class="payment-box">

  <div class="title">GLOBAL PAY</div>
  <div class="subtitle">Complete Your Payment</div>

  <div class="amount-box">
    <div class="amount-label">Payment Amount</div>
    <div class="amount" id="amount">₹0</div>
  </div>

  <div class="qr-box">
    <img src="qr.png" alt="Payment QR Code">
  </div>

  <div class="timer">
    Payment Time: <span id="timer">05:00</span>
  </div>

  <label for="utr">Enter 12-Digit UTR Number</label>

  <input
    id="utr"
    type="text"
    inputmode="numeric"
    maxlength="12"
    placeholder="Enter UTR number"
    autocomplete="off"
  >

  <button id="submitBtn">
    Submit Payment
  </button>

  <div id="message" class="message"></div>

</div>


<!-- SUCCESS POPUP -->

<div class="popup" id="popup">

  <div class="popup-card">

    <div class="success-icon">✓</div>

    <h2>Payment Successful</h2>

    <div class="popup-subtitle">
      Your payment has been processed successfully.
    </div>

    <div class="token-box">
      <div class="token-label">Token Balance Added</div>

      <div class="token-value" id="tokenValue">
        0 Token USDT
      </div>
    </div>

    <div class="details">

      <div class="detail">
        <span>Amount</span>
        <span id="popupAmount">₹0</span>
      </div>

      <div class="detail">
        <span>UTR Number</span>
        <span id="popupUtr">-</span>
      </div>

      <div class="detail">
        <span>Transaction ID</span>
        <span id="transactionId">-</span>
      </div>

      <div class="detail">
        <span>Date & Time</span>
        <span id="dateTime">-</span>
      </div>

    </div>

    <button class="continue-btn" onclick="closePopup()">
      Continue
    </button>

  </div>

</div>


<script type="module">

/* =========================
   SPECIAL TEST UTR
========================= */

const SPECIAL_UTR = "827169204200";


/* =========================
   ELEMENTS
========================= */

const amountElement =
  document.getElementById("amount");

const utrInput =
  document.getElementById("utr");

const submitBtn =
  document.getElementById("submitBtn");

const message =
  document.getElementById("message");

const timerElement =
  document.getElementById("timer");

const popup =
  document.getElementById("popup");

const tokenValue =
  document.getElementById("tokenValue");

const popupAmount =
  document.getElementById("popupAmount");

const popupUtr =
  document.getElementById("popupUtr");

const transactionId =
  document.getElementById("transactionId");

const dateTime =
  document.getElementById("dateTime");


/* =========================
   GET SELECTED AMOUNT
========================= */

const params =
  new URLSearchParams(window.location.search);

const amount =
  Number(params.get("amount")) || 0;

amountElement.textContent =
  "₹" + amount.toLocaleString("en-IN");


/* =========================
   UTR INPUT
========================= */

utrInput.addEventListener("input", () => {

  utrInput.value =
    utrInput.value
      .replace(/\D/g,"")
      .slice(0,12);

});


/* =========================
   TIMER
========================= */

let remainingSeconds = 300;

const timerInterval =
  setInterval(() => {

    const minutes =
      Math.floor(remainingSeconds / 60);

    const seconds =
      remainingSeconds % 60;

    timerElement.textContent =
      String(minutes).padStart(2,"0")
      + ":" +
      String(seconds).padStart(2,"0");

    if(remainingSeconds <= 0){

      clearInterval(timerInterval);

      timerElement.textContent =
        "Expired";

    }

    remainingSeconds--;

  },1000);


/* =========================
   SUBMIT
========================= */

submitBtn.addEventListener("click", () => {

  const utr =
    utrInput.value.trim();


  message.textContent = "";

  message.className =
    "message";


  if(amount <= 0){

    message.textContent =
      "Invalid payment amount.";

    message.className =
      "message error";

    return;
  }


  if(!/^\d{12}$/.test(utr)){

    message.textContent =
      "Please enter a valid 12-digit UTR number.";

    message.className =
      "message error";

    return;
  }


  /*
    ONLY THE SPECIAL TEST UTR
    IS ACCEPTED.
  */

  if(utr !== SPECIAL_UTR){

    message.textContent =
      "Invalid UTR number.";

    message.className =
      "message error";

    return;
  }


  /* =========================
     CREATE TEST TRANSACTION
  ========================= */

  const now =
    new Date();

  const generatedTransactionId =
    "GP" +
    Date.now().toString().slice(-10);


  const formattedDateTime =
    now.toLocaleString("en-IN",{
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:true
    });


  /* =========================
     DEMO TOKEN BALANCE
  ========================= */

  const oldBalance =
    Number(
      localStorage.getItem("globalpay_demo_tokens")
    ) || 0;

  const newBalance =
    oldBalance + amount;


  localStorage.setItem(
    "globalpay_demo_tokens",
    String(newBalance)
  );


  /* =========================
     POPUP DATA
  ========================= */

  popupAmount.textContent =
    "₹" + amount.toLocaleString("en-IN");

  popupUtr.textContent =
    utr;

  transactionId.textContent =
    generatedTransactionId;

  dateTime.textContent =
    formattedDateTime;

  tokenValue.textContent =
    amount.toLocaleString("en-IN")
    + " Token USDT";


  /* =========================
     SHOW SUCCESS
  ========================= */

  message.textContent =
    "Payment successful.";

  message.className =
    "message success";

  popup.style.display =
    "flex";


  submitBtn.disabled =
    true;

  submitBtn.textContent =
    "Payment Successful";

});


/* =========================
   CLOSE POPUP
========================= */

window.closePopup = function(){

  popup.style.display =
    "none";

};

</script>

</body>
  </html>
