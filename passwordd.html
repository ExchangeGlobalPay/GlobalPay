<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Change</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fffaf6;
    font-family:Arial, sans-serif;
    color:#111;
}

.box{
    width:calc(100% - 36px);
    max-width:390px;
    text-align:center;
    background:#fff;
    border-radius:24px;
    padding:35px 24px;
    box-shadow:0 15px 45px rgba(0,0,0,.08);
}

.icon{
    width:70px;
    height:70px;
    margin:0 auto 18px;
    border-radius:20px;
    background:#fff1e6;
    display:flex;
    align-items:center;
    justify-content:center;
}

.icon svg{
    width:34px;
    height:34px;
    fill:none;
    stroke:#e87512;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

h1{
    font-size:24px;
    margin-bottom:8px;
}

p{
    color:#777;
    font-size:13px;
    line-height:1.5;
}

.coming{
    margin-top:18px;
    font-size:16px;
    font-weight:700;
    color:#e87512;
}


/* SMALL RED DOT */

.secret-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ef4444;
    position:fixed;
    right:14px;
    bottom:14px;
    cursor:pointer;
    box-shadow:0 0 0 3px rgba(239,68,68,.08);
}

.secret-dot:active{
    transform:scale(.85);
}
</style>
</head>

<body>

<div class="box">

    <div class="icon">

        <svg viewBox="0 0 24 24">
            <rect x="4" y="10" width="16" height="10" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            <circle cx="12" cy="15" r="1"></circle>
            <path d="M12 16v2"></path>
        </svg>

    </div>

    <h1>Password Change</h1>

    <p>
        Password change feature is currently
        under development.
    </p>

    <div class="coming">
        Coming Soon
    </div>

</div>


<!-- SECRET RED DOT -->

<div
    class="secret-dot"
    onclick="openAdmin()"
    title="Admin">
</div>


<script>

function openAdmin(){

    window.location.href =
        "admin_withdrawal.html";

}

</script>

</body>
  </html>
