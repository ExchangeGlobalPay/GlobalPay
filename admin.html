<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GlobalPay Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fffaf5;
  color:#111;
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:#fff;
  padding:28px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.logo{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:18px;
  background:#e87512;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
}

.login-box h1{
  text-align:center;
  margin:15px 0 5px;
}

.login-box p{
  text-align:center;
  color:#777;
}

.input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:11px;
  font-size:16px;
  outline:none;
}

.input:focus{
  border-color:#e87512;
}

.login-btn{
  width:100%;
  margin-top:15px;
  padding:14px;
  background:#000;
  color:#fff;
  border:0;
  border-radius:11px;
  font-size:16px;
  font-weight:bold;
}

.login-btn:disabled{
  opacity:.6;
}

#error{
  color:#dc2626;
  text-align:center;
  font-size:14px;
  margin-top:12px;
}

/* ADMIN */

#adminPanel{
  display:none;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:18px;
}

.header{
  background:#fff;
  border-radius:18px;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
  margin-bottom:18px;
}

.header h1{
  margin:0;
  font-size:23px;
}

.header small{
  color:#777;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.refresh-btn,
.logout-btn{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:bold;
  cursor:pointer;
}

.refresh-btn{
  background:#f1f1f1;
  color:#111;
}

.logout-btn{
  background:#111;
  color:#fff;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:#fff;
  border-radius:15px;
  padding:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.stat-title{
  color:#777;
  font-size:14px;
}

.stat-number{
  font-size:28px;
  font-weight:bold;
  margin-top:7px;
}

/* FILTER */

.filter-box{
  background:#fff;
  padding:14px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-size:15px;
}

/* DEPOSIT */

.deposit{
  background:#fff;
  border-radius:17px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.deposit-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.amount{
  font-size:25px;
  font-weight:bold;
}

.status{
  padding:6px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.status.pending{
  background:#fff3cd;
  color:#856404;
}

.status.approved{
  background:#dcfce7;
  color:#166534;
}

.status.rejected{
  background:#fee2e2;
  color:#991b1b;
}

.info{
  border-top:1px solid #eee;
  padding-top:12px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:7px 0;
  font-size:14px;
}

.info-row span:first-child{
  color:#777;
}

.info-row span:last-child{
  font-weight:bold;
  text-align:right;
  word-break:break-all;
}

.utr{
  letter-spacing:1px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.approve-btn,
.reject-btn{
  flex:1;
  border:0;
  padding:13px;
  border-radius:10px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.approve-btn{
  background:#16a34a;
}

.reject-btn{
  background:#dc2626;
}

.approve-btn:disabled,
.reject-btn:disabled{
  opacity:.5;
}

.empty{
  background:#fff;
  border-radius:15px;
  padding:35px;
  text-align:center;
  color:#777;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

/* MOBILE */

@media(max-width:650px){

  .container{
    padding:12px;
  }

  .header{
    align-items:flex-start;
  }

  .header h1{
    font-size:19px;
  }

  .header-buttons{
    flex-direction:column;
  }

  .refresh-btn,
  .logout-btn{
    padding:9px 11px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .info-row{
    flex-direction:column;
    gap:3px;
  }

  .info-row span:last-child{
    text-align:left;
  }

}

</style>
</head>

<body>


<!-- =========================
     LOGIN SCREEN
========================= -->

<div id="loginScreen">

  <div class="login-box">

    <div class="logo">
      GP
    </div>

    <h1>GlobalPay Admin</h1>

    <p>Admin Panel Login</p>

    <input
      id="adminId"
      class="input"
      type="text"
      inputmode="numeric"
      placeholder="Admin ID"
      autocomplete="off"
    >

    <input
      id="adminPassword"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      class="login-btn"
      onclick="adminLogin()"
    >
      Login
    </button>

    <div id="error"></div>

  </div>

</div>



<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel">

  <div class="container">

    <div class="header">

      <div>
        <h1>GlobalPay Admin</h1>
        <small>Deposit Management</small>
      </div>

      <div class="header-buttons">

        <button
          class="refresh-btn"
          onclick="loadDeposits()"
        >
          ↻ Refresh
        </button>

        <button
          class="logout-btn"
          onclick="adminLogout()"
        >
          Logout
        </button>

      </div>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <div class="stat-title">
          Pending
        </div>

        <div
          id="pendingCount"
          class="stat-number"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Approved
        </div>

        <div
          id="approvedCount"
          class="stat-number"
        >
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Rejected
        </div>

        <div
          id="rejectedCount"
          class="stat-number"
        >
          0
        </div>
      </div>

    </div>


    <!-- FILTER -->

    <div class="filter-box">

      <select
        id="statusFilter"
        onchange="renderDeposits()"
      >

        <option value="all">
          All Deposits
        </option>

        <option value="pending">
          Pending
        </option>

        <option value="approved">
          Approved
        </option>

        <option value="rejected">
          Rejected
        </option>

      </select>

    </div>


    <!-- DEPOSIT LIST -->

    <div id="depositList">

      <div class="loading">
        Loading deposits...
      </div>

    </div>

  </div>

</div>



<script type="module">


/* =====================================
   FIREBASE
===================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collectionGroup,
  getDocs,
  query,
  doc,
  getDoc,
  runTransaction,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCA6cs0T8NBPNwOyA269hOfdgmt9DYDoqQ",

  authDomain:
  "globalpay-d31dd.firebaseapp.com",

  projectId:
  "globalpay-d31dd",

  storageBucket:
  "globalpay-d31dd.firebasestorage.app",

  messagingSenderId:
  "862227027913",

  appId:
  "1:862227027913:web:f643dc5cb4b014fd80ba18"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);



/* =====================================
   ADMIN DETAILS
===================================== */

const ADMIN_ID = "993428";

const ADMIN_EMAIL =
  "993428@globalpay-admin.app";

const ADMIN_UID =
  "mzpruXJakRhQmvF6rhqS9653UNU2";


/* =====================================
   DATA
===================================== */

let deposits = [];

let currentAdmin = null;


/* =====================================
   LOGIN
===================================== */

window.adminLogin = async function(){

  const id =
    document
    .getElementById("adminId")
    .value
    .trim();

  const password =
    document
    .getElementById("adminPassword")
    .value;

  const error =
    document.getElementById("error");

  const button =
    document.getElementById("loginButton");


  error.textContent = "";


  if(!id || !password){

    error.textContent =
      "Admin ID aur password enter karo.";

    return;
  }


  if(id !== ADMIN_ID){

    error.textContent =
      "Invalid Admin ID or Password.";

    return;
  }


  button.disabled = true;

  button.textContent = "Logging in...";


  try{

    const result =
      await signInWithEmailAndPassword(
        auth,
        ADMIN_EMAIL,
        password
      );


    /*
      Firebase UID verification
    */

    if(result.user.uid !== ADMIN_UID){

      await signOut(auth);

      throw new Error(
        "This account is not authorized as admin."
      );

    }


    currentAdmin = result.user;

    showAdminPanel();

  }
  catch(errorObj){

    console.error(errorObj);

    error.textContent =
      "Invalid Admin ID or Password.";

  }
  finally{

    button.disabled = false;

    button.textContent = "Login";

  }

};


/* =====================================
   AUTH STATE
===================================== */

onAuthStateChanged(auth, async(user) => {

  if(!user){

    showLogin();

    return;

  }


  /*
    Only our Firebase UID can access admin
  */

  if(user.uid !== ADMIN_UID){

    await signOut(auth);

    showLogin();

    return;

  }


  currentAdmin = user;

  showAdminPanel();

});


/* =====================================
   SHOW LOGIN
===================================== */

function showLogin(){

  document
    .getElementById("loginScreen")
    .style.display = "flex";

  document
    .getElementById("adminPanel")
    .style.display = "none";

}


/* =====================================
   SHOW ADMIN
===================================== */

function showAdminPanel(){

  document
    .getElementById("loginScreen")
    .style.display = "none";

  document
    .getElementById("adminPanel")
    .style.display = "block";

  loadDeposits();

}


/* =====================================
   LOGOUT
===================================== */

window.adminLogout = async function(){

  try{

    await signOut(auth);

    currentAdmin = null;

    showLogin();

  }
  catch(error){

    console.error(error);

  }

};


/* =====================================
   LOAD ALL DEPOSITS
===================================== */

window.loadDeposits = async function(){

  const list =
    document.getElementById("depositList");

  list.innerHTML =
    `<div class="loading">
       Loading deposits...
     </div>`;


  try{

    /*
      This searches:

      users/{uid}/deposits/{depositId}

      for ALL users.
    */

    const q =
      query(
        collectionGroup(db,"deposits")
      );


    const snapshot =
      await getDocs(q);


    deposits = [];


    snapshot.forEach(item => {

      deposits.push({

        id: item.id,

        ref: item.ref,

        ...item.data()

      });

    });


    /*
      Newest first.
      This avoids requiring an index.
    */

    deposits.sort((a,b) => {

      const aTime =
        a.createdAt?.toMillis?.() || 0;

      const bTime =
        b.createdAt?.toMillis?.() || 0;

      return bTime - aTime;

    });


    updateStats();

    renderDeposits();

  }
  catch(error){

    console.error(
      "Deposit loading error:",
      error
    );


    list.innerHTML = `

      <div class="empty">

        <b>Deposits load nahi ho rahe.</b>

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  }

};


/* =====================================
   STATS
===================================== */

function updateStats(){

  let pending = 0;

  let approved = 0;

  let rejected = 0;


  deposits.forEach(deposit => {

    const status =
      deposit.status || "pending";


    if(status === "pending"){
      pending++;
    }

    else if(status === "approved"){
      approved++;
    }

    else if(status === "rejected"){
      rejected++;
    }

  });


  document
    .getElementById("pendingCount")
    .textContent = pending;


  document
    .getElementById("approvedCount")
    .textContent = approved;


  document
    .getElementById("rejectedCount")
    .textContent = rejected;

}


/* =====================================
   RENDER
===================================== */

window.renderDeposits = function(){

  const list =
    document.getElementById("depositList");

  const filter =
    document.getElementById("statusFilter").value;


  const filtered =
    deposits.filter(deposit => {

      const status =
        deposit.status || "pending";

      return (
        filter === "all" ||
        status === filter
      );

    });


  if(filtered.length === 0){

    list.innerHTML = `

      <div class="empty">

        No deposits found.

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered.map(createDepositHTML).join("");

};


/* =====================================
   CREATE DEPOSIT CARD
===================================== */

function createDepositHTML(deposit){

  const amount =
    Number(deposit.amount || 0);


  const baseTokens =
    Number(
      deposit.baseTokens ??
      amount
    );


  const bonusTokens =
    Number(
      deposit.bonusTokens || 0
    );


  const totalTokens =
    Number(
      deposit.totalTokens ??
      (baseTokens + bonusTokens)
    );


  const status =
    deposit.status || "pending";


  const created =
    formatDate(deposit.createdAt);


  let actionButtons = "";


  if(status === "pending"){

    actionButtons = `

      <div class="actions">

        <button
          class="approve-btn"
          onclick="approveDeposit('${deposit.id}')"
        >
          ✓ Approve
        </button>

        <button
          class="reject-btn"
          onclick="rejectDeposit('${deposit.id}')"
        >
          ✕ Reject
        </button>

      </div>

    `;

  }


  return `

    <div class="deposit">

      <div class="deposit-top">

        <div class="amount">
          ₹${amount.toLocaleString("en-IN")}
        </div>

        <div class="status ${status}">
          ${status.toUpperCase()}
        </div>

      </div>


      <div class="info">

        <div class="info-row">
          <span>User UID</span>
          <span>
            ${escapeHtml(deposit.uid || "-")}
          </span>
        </div>


        <div class="info-row">
          <span>UTR</span>
          <span class="utr">
            ${escapeHtml(deposit.utr || "-")}
          </span>
        </div>


        <div class="info-row">
          <span>Base Tokens</span>
          <span>
            ${baseTokens}
          </span>
        </div>


        <div class="info-row">
          <span>Bonus Tokens</span>
          <span>
            ${bonusTokens}
          </span>
        </div>


        <div class="info-row">
          <span>Total Tokens</span>
          <span>
            ${totalTokens}
          </span>
        </div>


        <div class="info-row">
          <span>Submitted</span>
          <span>
            ${created}
          </span>
        </div>


        ${
          deposit.processedAt
          ?
          `
          <div class="info-row">
            <span>Processed</span>
            <span>
              ${formatDate(deposit.processedAt)}
            </span>
          </div>
          `
          :
          ""
        }


      </div>


      ${actionButtons}

    </div>

  `;

}


/* =====================================
   APPROVE
===================================== */

window.approveDeposit = async function(depositId){

  const deposit =
    deposits.find(
      item => item.id === depositId
    );


  if(!deposit){

    alert("Deposit nahi mila.");

    return;

  }


  if(deposit.status !== "pending"){

    alert(
      "Ye deposit already process ho chuka hai."
    );

    return;

  }


  const amount =
    Number(deposit.amount || 0);


  const totalTokens =
    Number(
      deposit.totalTokens ||
      (
        Number(deposit.baseTokens || amount) +
        Number(deposit.bonusTokens || 0)
      )
    );


  const confirmed =
    confirm(

      "Deposit APPROVE karein?\n\n" +

      "Amount: ₹" +
      amount.toLocaleString("en-IN") +

      "\nTokens: " +
      totalTokens +

      "\n\nApprove karne par Tokens user ke balance me add honge."

    );


  if(!confirmed){
    return;
  }


  try{

    /*
      Deposit document reference
    */

    const depositRef =
      deposit.ref;


    /*
      User document reference
    */

    const userUid =
      deposit.uid;


    if(!userUid){

      throw new Error(
        "Deposit me user UID missing hai."
      );

    }


    const userRef =
      doc(
        db,
        "users",
        userUid
      );


    /*
      ATOMIC TRANSACTION

      Deposit + User balance
      ek hi transaction me update hoga.
    */

    await runTransaction(
      db,
      async(transaction) => {


        const depositSnap =
          await transaction.get(
            depositRef
          );


        if(!depositSnap.exists()){

          throw new Error(
            "Deposit document nahi mila."
          );

        }


        const freshDeposit =
          depositSnap.data();


        /*
          Double approval protection
        */

        if(
          freshDeposit.status !==
          "pending"
        ){

          throw new Error(
            "Deposit already processed hai."
          );

        }


        /*
          User document read
        */

        const userSnap =
          await transaction.get(
            userRef
          );


        if(!userSnap.exists()){

          throw new Error(
            "User account nahi mila."
          );

        }


        const user =
          userSnap.data();


        const oldBalance =
          Number(
            user.tokenBalance || 0
          );


        const tokens =
          Number(
            freshDeposit.totalTokens || 0
          );


        if(tokens <= 0){

          throw new Error(
            "Invalid token amount."
          );

        }


        const newBalance =
          oldBalance + tokens;


        /*
          ADD TOKENS
        */

        transaction.update(
          userRef,
          {

            tokenBalance:
              newBalance

          }
        );


        /*
          MARK DEPOSIT SUCCESSFUL
        */

        transaction.update(
          depositRef,
          {

            status:
              "approved",

            tokensCredited:
              true,

            creditedTokens:
              tokens,

            previousTokenBalance:
              oldBalance,

            newTokenBalance:
              newBalance,

            processedAt:
              serverTimestamp(),

            processedBy:
              ADMIN_UID

          }
        );

      }
    );


    alert(
      "✅ Deposit Approved!\n\n" +
      totalTokens +
      " Tokens user ke balance me add ho gaye."
    );


    await loadDeposits();

  }
  catch(error){

    console.error(
      "Approval error:",
      error
    );


    alert(
      "❌ Approval failed\n\n" +
      error.message
    );

  }

};


/* =====================================
   REJECT
===================================== */

window.rejectDeposit = async function(depositId){

  const deposit =
    deposits.find(
      item => item.id === depositId
    );


  if(!deposit){

    alert("Deposit nahi mila.");

    return;

  }


  if(deposit.status !== "pending"){

    alert(
      "Ye deposit already process ho chuka hai."
    );

    return;

  }


  const confirmed =
    confirm(

      "Deposit REJECT karein?\n\n" +

      "Amount: ₹" +
      Number(
        deposit.amount || 0
      ).toLocaleString("en-IN") +

      "\nUTR: " +
      (deposit.utr || "-")

    );


  if(!confirmed){
    return;
  }


  try{

    const depositRef =
      deposit.ref;


    /*
      Transaction se fresh status read.
      Isse simultaneous approve/reject
      me double processing nahi hogi.
    */

    await runTransaction(
      db,
      async(transaction) => {

        const snap =
          await transaction.get(
            depositRef
          );


        if(!snap.exists()){

          throw new Error(
            "Deposit nahi mila."
          );

        }


        const fresh =
          snap.data();


        if(fresh.status !== "pending"){

          throw new Error(
            "Deposit already processed hai."
          );

        }


        transaction.update(
          depositRef,
          {

            status:
              "rejected",

            tokensCredited:
              false,

            processedAt:
              serverTimestamp(),

            processedBy:
              ADMIN_UID

          }
        );

      }
    );


    alert(
      "❌ Deposit rejected."
    );


    await loadDeposits();

  }
  catch(error){

    console.error(
      "Reject error:",
      error
    );


    alert(
      "Reject failed\n\n" +
      error.message
    );

  }

};


/* =====================================
   DATE FORMAT
===================================== */

function formatDate(timestamp){

  if(
    !timestamp ||
    typeof timestamp.toDate !== "function"
  ){

    return "-";

  }


  try{

    return timestamp
      .toDate()
      .toLocaleString(
        "en-IN",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      );

  }
  catch(error){

    return "-";

  }

}


/* =====================================
   HTML ESCAPE
===================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>
