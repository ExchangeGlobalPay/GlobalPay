<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>GlobalPay</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    color:#172033;
    background:#fffdfb;
}

/* ================= BACKGROUND ================= */

.page{
    width:100%;
    min-height:100vh;

    background-color:#fffdfb;

    background-image:
        linear-gradient(
            rgba(232,228,223,.42) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(232,228,223,.42) 1px,
            transparent 1px
        );

    background-size:41px 41px;

    padding:0 0 28px;
}

/* ================= MAIN ================= */

.container{
    width:calc(100% - 48px);
    max-width:600px;
    margin:0 auto;
}

/* ================= LOGO ================= */

.logo{
    width:74px;
    height:74px;

    margin:18px auto 25px;

    border-radius:18px;

    background:#f1f4f8;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    box-shadow:
        0 7px 18px rgba(20,45,75,.07);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ================= HEADING ================= */

.title{
    text-align:center;

    font-size:25px;
    line-height:1.2;

    font-weight:800;

    color:#172033;

    margin-bottom:10px;
}

.subtitle{
    text-align:center;

    font-size:14px;
    line-height:1.5;

    color:#9b9da4;

    white-space:nowrap;

    margin-bottom:29px;
}

/* ================= TABS ================= */

.tabs{
    width:100%;
    height:47px;

    padding:4px;

    display:flex;

    background:#fff0e9;

    border-radius:14px;

    margin-bottom:19px;
}

.tab{
    width:50%;
    height:39px;

    border:0;
    border-radius:11px;

    background:transparent;

    color:#9699a1;

    font-family:inherit;

    font-size:16px;
    font-weight:700;

    cursor:pointer;
}

.tab.active{
    background:#fff;

    color:#e87512;

    box-shadow:
        0 2px 7px rgba(0,0,0,.08);
}

/* ================= LABEL ================= */

.label{
    display:block;

    font-size:16px;
    line-height:1.2;

    font-weight:700;

    color:#65748a;

    margin-bottom:7px;
}

/* ================= FIELD ================= */

.field{
    width:100%;
    height:47px;

    background:#fff;

    border:1.5px solid #e2e2e2;

    border-radius:14px;

    display:flex;
    align-items:center;

    position:relative;

    margin-bottom:23px;

    overflow:hidden;
}

.field input{
    width:100%;
    height:100%;

    border:0;
    outline:0;

    background:transparent;

    padding:0 13px;

    font-family:inherit;

    font-size:15px;

    color:#27303c;
}

.field input::placeholder{
    color:#c4c7cc;
}

/* ================= PHONE ================= */

.country{
    width:80px;
    height:100%;

    flex-shrink:0;

    border-right:1.5px solid #e4e4e4;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:13px;

    color:#606269;

    font-size:15px;
    font-weight:700;
}

.arrow{
    width:9px;
    height:9px;

    border-right:1.5px solid #aaa;
    border-bottom:1.5px solid #aaa;

    transform:rotate(45deg);

    margin-top:-5px;
}

/* ================= PASSWORD ================= */

.password-field input{
    padding-right:45px;
}

.eye{
    position:absolute;

    right:15px;
    top:50%;

    transform:translateY(-50%);

    color:#777;

    font-size:17px;

    cursor:pointer;
}

/* ================= CAPTCHA ================= */

.captcha-box{
    position:relative;
}

.captcha-image{
    position:absolute;

    right:8px;
    top:50%;

    transform:translateY(-50%);

    width:70px;
    height:31px;

    background:#f0f0f0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;

    color:#333;

    letter-spacing:-2px;
}

/* ================= BUTTON ================= */

.main-button{
    width:100%;
    height:47px;

    border:0;
    border-radius:14px;

    background:#111;

    color:#fff;

    font-family:inherit;

    font-size:17px;
    font-weight:800;

    cursor:pointer;
}

/* ================= FORGOT ================= */

.forgot{
    display:block;

    text-align:center;

    margin-top:18px;

    color:#e87512;

    font-size:16px;
    font-weight:700;

    text-decoration:none;
}

/* ================= LANGUAGE ================= */

.language{
    width:max-content;

    margin:22px auto 0;

    display:flex;
    align-items:center;

    gap:7px;

    color:#666;

    font-size:16px;

    cursor:pointer;
}

.globe{
    font-size:19px;
}

/* ================= LANGUAGE MENU ================= */

.language-menu{
    display:none;

    width:150px;

    margin:9px auto 0;

    background:#fff;

    border:1px solid #eee;

    border-radius:11px;

    overflow:hidden;

    box-shadow:0 6px 20px rgba(0,0,0,.10);
}

.language-menu.show{
    display:block;
}

.language-menu button{
    width:100%;
    height:38px;

    border:0;

    background:#fff;

    font-family:inherit;

    font-size:14px;

    color:#333;

    cursor:pointer;
}

.language-menu button:active{
    background:#fff3ed;
}

/* ================= SECURITY ================= */

.security{
    width:100%;

    margin-top:24px;

    padding:14px 15px;

    border-radius:15px;

    background:#fff1e9;

    color:#a65e35;

    font-size:13px;

    line-height:1.55;
}

.security-icon{
    margin-right:6px;
}

/* ================= SIGN UP ================= */

.signup{
    display:none;
}

/* ================= OTP ================= */

.otp-send{
    position:absolute;

    right:6px;
    top:5px;

    height:35px;

    padding:0 17px;

    border:0;

    border-radius:11px;

    background:#f56d00;

    color:#fff;

    font-family:inherit;

    font-size:14px;

    cursor:pointer;
}

/* ================= SMALL MOBILE ================= */

@media(max-width:380px){

    .container{
        width:calc(100% - 40px);
    }

    .logo{
        width:72px;
        height:72px;
        margin-top:16px;
    }

    .title{
        font-size:24px;
    }

    .subtitle{
        font-size:13px;
    }

}

/* ================= VERY SMALL ================= */

@media(max-width:340px){

    .container{
        width:calc(100% - 30px);
    }

    .title{
        font-size:22px;
    }

    .subtitle{
        font-size:12px;
    }

    .tab{
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="page">

<div class="container">

    <!-- LOGO -->
    <!-- Global.png ko GitHub repository ke same folder me rakho -->
    <div class="logo">
        <img src="Global.png" alt="GlobalPay">
    </div>


    <!-- TITLE -->

    <h1 class="title" id="welcome">
        Welcome to GlobalPay
    </h1>

    <div class="subtitle" id="subtitle">
        Sign in to manage recharges, tasks and rewards
    </div>


    <!-- TABS -->

    <div class="tabs">

        <button
            class="tab active"
            id="signinTab"
            onclick="showSignIn()">
            Sign In
        </button>

        <button
            class="tab"
            id="signupTab"
            onclick="showSignUp()">
            Sign Up
        </button>

    </div>


    <!-- ================= SIGN IN ================= -->

    <div id="signinForm">

        <label class="label" id="mobileLabel">
            Mobile number
        </label>

        <div class="field">

            <div class="country">
                <span>+91</span>
                <span class="arrow"></span>
            </div>

            <input
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="Phone Number"
                id="loginMobile">

        </div>


        <label class="label" id="passwordLabel">
            Password
        </label>

        <div class="field password-field">

            <input
                type="password"
                id="loginPassword"
                placeholder="Password">

            <span
                class="eye"
                onclick="togglePassword('loginPassword',this)">
                👁
            </span>

        </div>


        <!-- CAPTCHA -->

        <div class="field captcha-box">

            <input
                type="text"
                placeholder="Captcha"
                id="captchaInput">

            <div class="captcha-image">
                EƎCy
            </div>

        </div>


        <!-- SIGN IN -->

        <button
            class="main-button"
            id="signinButton"
            type="button"
            onclick="signIn()">

            Sign In

        </button>


        <!-- FORGOT -->

        <a
            href="#"
            class="forgot"
            id="forgot">

            Forgot Password?

        </a>

    </div>


    <!-- ================= SIGN UP ================= -->

    <div
        id="signupForm"
        class="signup">

        <label class="label" id="signupMobileLabel">
            Mobile number
        </label>

        <div class="field">

            <div class="country">
                <span>+91</span>
                <span class="arrow"></span>
            </div>

            <input
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="Phone Number"
                id="signupMobile">

        </div>


        <div class="field password-field">

            <input
                type="password"
                id="signupPassword"
                placeholder="Password">

            <span
                class="eye"
                onclick="togglePassword('signupPassword',this)">
                👁
            </span>

        </div>


        <div class="field password-field">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password">

            <span
                class="eye"
                onclick="togglePassword('confirmPassword',this)">
                👁
            </span>

        </div>


        <div class="field">

            <input
                type="text"
                value="22626WUH"
                readonly>

        </div>


        <div class="field">

            <input
                type="text"
                placeholder="OTP Code"
                id="otpInput">

            <button
                type="button"
                class="otp-send"
                onclick="sendOTP()"
                id="sendOtp">

                Send

            </button>

        </div>


        <button
            class="main-button"
            type="button"
            id="signupButton"
            onclick="signUp()">

            Sign Up

        </button>

    </div>


    <!-- ================= LANGUAGE ================= -->

    <div
        class="language"
        onclick="languageMenu()">

        <span class="globe">🌐</span>

        <span id="languageText">
            Language
        </span>

    </div>


    <!-- LANGUAGE MENU -->

    <div
        class="language-menu"
        id="languageMenu">

        <button onclick="changeLanguage('en')">
            English
        </button>

        <button onclick="changeLanguage('hi')">
            हिन्दी
        </button>

    </div>


    <!-- SECURITY -->

    <div class="security">

        <span class="security-icon">🛡️</span>

        <span id="security">
            Your funds and data are protected.
            GlobalPay never shares your information.
        </span>

    </div>

</div>

</div>


<script>

/* ================= TAB ================= */

function showSignIn(){

    document.getElementById("signinForm").style.display="block";
    document.getElementById("signupForm").style.display="none";

    document.getElementById("signinTab").classList.add("active");
    document.getElementById("signupTab").classList.remove("active");
}


function showSignUp(){

    document.getElementById("signinForm").style.display="none";
    document.getElementById("signupForm").style.display="block";

    document.getElementById("signinTab").classList.remove("active");
    document.getElementById("signupTab").classList.add("active");
}


/* ================= PASSWORD ================= */

function togglePassword(id,icon){

    const input=document.getElementById(id);

    if(input.type==="password"){

        input.type="text";
        icon.textContent="🙈";

    }else{

        input.type="password";
        icon.textContent="👁";

    }
}


/* ================= LANGUAGE MENU ================= */

function languageMenu(){

    document
        .getElementById("languageMenu")
        .classList.toggle("show");

}


/* ================= LANGUAGE ================= */

function changeLanguage(lang){

    if(lang==="hi"){

        document.getElementById("welcome").innerText=
            "GlobalPay में आपका स्वागत है";

        document.getElementById("subtitle").innerText=
            "रिचार्ज, टास्क और रिवॉर्ड मैनेज करने के लिए साइन इन करें";

        document.getElementById("signinTab").innerText=
            "साइन इन";

        document.getElementById("signupTab").innerText=
            "साइन अप";

        document.getElementById("mobileLabel").innerText=
            "मोबाइल नंबर";

        document.getElementById("passwordLabel").innerText=
            "पासवर्ड";

        document.getElementById("signinButton").innerText=
            "साइन इन";

        document.getElementById("forgot").innerText=
            "पासवर्ड भूल गए?";

        document.getElementById("languageText").innerText=
            "भाषा";

        document.getElementById("security").innerText=
            "आपका फंड और डेटा सुरक्षित है। GlobalPay आपकी जानकारी कभी शेयर नहीं करता।";

        document.getElementById("signupMobileLabel").innerText=
            "मोबाइल नंबर";

        document.getElementById("signupButton").innerText=
            "साइन अप";

        document.getElementById("sendOtp").innerText=
            "भेजें";

        document.getElementById("loginMobile").placeholder=
            "फोन नंबर";

        document.getElementById("loginPassword").placeholder=
            "पासवर्ड";

        document.getElementById("captchaInput").placeholder=
            "कैप्चा";

        document.getElementById("signupMobile").placeholder=
            "फोन नंबर";

        document.getElementById("signupPassword").placeholder=
            "पासवर्ड";

        document.getElementById("confirmPassword").placeholder=
            "पासवर्ड की पुष्टि करें";

        document.getElementById("otpInput").placeholder=
            "OTP कोड";

        localStorage.setItem("lang","hi");

    }else{

        document.getElementById("welcome").innerText=
            "Welcome to GlobalPay";

        document.getElementById("subtitle").innerText=
            "Sign in to manage recharges, tasks and rewards";

        document.getElementById("signinTab").innerText=
            "Sign In";

        document.getElementById("signupTab").innerText=
            "Sign Up";

        document.getElementById("mobileLabel").innerText=
            "Mobile number";

        document.getElementById("passwordLabel").innerText=
            "Password";

        document.getElementById("signinButton").innerText=
            "Sign In";

        document.getElementById("forgot").innerText=
            "Forgot Password?";

        document.getElementById("languageText").innerText=
            "Language";

        document.getElementById("security").innerText=
            "Your funds and data are protected. GlobalPay never shares your information.";

        document.getElementById("signupMobileLabel").innerText=
            "Mobile number";

        document.getElementById("signupButton").innerText=
            "Sign Up";

        document.getElementById("sendOtp").innerText=
            "Send";

        document.getElementById("loginMobile").placeholder=
            "Phone Number";

        document.getElementById("loginPassword").placeholder=
            "Password";

        document.getElementById("captchaInput").placeholder=
            "Captcha";

        document.getElementById("signupMobile").placeholder=
            "Phone Number";

        document.getElementById("signupPassword").placeholder=
            "Password";

        document.getElementById("confirmPassword").placeholder=
            "Confirm Password";

        document.getElementById("otpInput").placeholder=
            "OTP Code";

        localStorage.setItem("lang","en");
    }

    document
        .getElementById("languageMenu")
        .classList.remove("show");
}


/* ================= LOAD LANGUAGE ================= */

window.onload=function(){

    if(localStorage.getItem("lang")==="hi"){
        changeLanguage("hi");
    }

};


/* ================= OTP ================= */

function sendOTP(){

    /*
      Yahan baad me real OTP API connect hogi.
      GitHub Pages se directly SMS OTP bhejna secure nahi hai.
    */

    alert("OTP service will be connected to the secure backend.");

}


/* ================= SIGN IN ================= */

function signIn(){

    const mobile =
        document.getElementById("loginMobile").value.trim();

    const password =
        document.getElementById("loginPassword").value.trim();

    const captcha =
        document.getElementById("captchaInput").value.trim();

    if(mobile.length !== 10){

        alert(
            localStorage.getItem("lang")==="hi"
            ? "कृपया सही मोबाइल नंबर डालें।"
            : "Please enter a valid mobile number."
        );

        return;
    }

    if(password.length < 6){

        alert(
            localStorage.getItem("lang")==="hi"
            ? "पासवर्ड कम से कम 6 अक्षरों का होना चाहिए।"
            : "Password must be at least 6 characters."
        );

        return;
    }

    if(captcha===""){

        alert(
            localStorage.getItem("lang")==="hi"
            ? "कृपया कैप्चा डालें।"
            : "Please enter the captcha."
        );

        return;
    }

    /*
      IMPORTANT:
      Real login API/backend yahan connect hoga.
    */

    alert(
        localStorage.getItem("lang")==="hi"
        ? "लॉगिन सिस्टम को सुरक्षित सर्वर से कनेक्ट करना बाकी है।"
        : "The login system still needs to be connected to the secure server."
    );
}


/* ================= SIGN UP ================= */

function signUp(){

    const mobile =
        document.getElementById("signupMobile").value.trim();

    const password =
        document.getElementById("signupPassword").value;

    const confirm =
        document.getElementById("confirmPassword").value;

    const otp =
        document.getElementById("otpInput").value.trim();

    if(mobile.length !== 10){

        alert(
            localStorage.getItem("lang")==="hi"
            ? "कृपया सही मोबाइल नंबर डालें।"
            : "Please enter a valid mobile number."
        );

        return;
    }

    if(password.length < 6){

        alert(
            localStorage.getItem("lang")==="hi"
            ? "पासवर्ड कम से कम 6 अक्षरों का होना चाहिए।"
            : "Password must be at least 6 characters."
        );

        return;
    }

    if(password !== confirm){

        alert(
            localStorage.getItem("lang")==="hi"
            ? "दोनों पासवर्ड एक जैसे नहीं हैं।"
            : "Passwords do not match."
        );

        return;
    }

    if(otp===""){

        alert(
            localStorage.getItem("lang")==="hi"
            ? "कृपया OTP डालें।"
            : "Please enter the OTP."
        );

        return;
    }

    /*
      Real registration API/backend yahan connect hoga.
    */

    alert(
        localStorage.getItem("lang")==="hi"
        ? "रजिस्ट्रेशन सिस्टम को सुरक्षित सर्वर से कनेक्ट करना बाकी है।"
        : "The registration system still needs to be connected to the secure server."
    );
}

</script>

</body>
  </html>
