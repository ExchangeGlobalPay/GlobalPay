<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>GlobalPay</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#172033;
    background:#fffdfb;
}

/* ================= BACKGROUND ================= */

.page{
    width:100%;
    min-height:100vh;

    padding:20px 0 22px;

    background-color:#fffdfb;

    background-image:
        linear-gradient(
            rgba(231,228,224,.42) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(231,228,224,.42) 1px,
            transparent 1px
        );

    background-size:41px 41px;
}

/* ================= CONTAINER ================= */

.container{
    width:calc(100% - 48px);
    max-width:600px;
    margin:0 auto;
}

/* ================= LOGO ================= */

.logo{
    width:74px;
    height:74px;

    margin:24px auto 24px;

    border-radius:19px;

    background:#f1f4f8;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    box-shadow:
        0 8px 22px rgba(20,45,75,.08);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ================= TITLE ================= */

.title{
    text-align:center;

    font-size:25px;
    line-height:30px;

    font-weight:800;

    color:#172033;

    margin-bottom:10px;

    white-space:nowrap;
}

.subtitle{
    text-align:center;

    font-size:14px;
    line-height:20px;

    color:#9b9da4;

    margin-bottom:27px;

    white-space:nowrap;
}

/* ================= TABS ================= */

.tabs{
    width:100%;
    height:48px;

    padding:4px;

    display:flex;

    background:#fff0e9;

    border-radius:14px;

    margin-bottom:20px;
}

.tab{
    width:50%;
    height:40px;

    border:0;

    border-radius:11px;

    background:transparent;

    color:#9699a1;

    font-family:Arial,Helvetica,sans-serif;

    font-size:16px;
    font-weight:700;

    cursor:pointer;
}

.tab.active{
    background:#fff;

    color:#e87512;

    box-shadow:
        0 2px 8px rgba(0,0,0,.08);
}

/* ================= LABEL ================= */

.label{
    display:block;

    font-size:16px;
    line-height:20px;

    font-weight:700;

    color:#65748a;

    margin-bottom:7px;
}

/* ================= FIELD ================= */

.field{
    width:100%;
    height:47px;

    background:#fff;

    border:1.5px solid #e2e2e2;

    border-radius:14px;

    display:flex;
    align-items:center;

    position:relative;

    margin-bottom:22px;

    overflow:hidden;
}

.field input{
    width:100%;
    height:100%;

    border:0;
    outline:0;

    background:transparent;

    padding:0 13px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:15px;

    color:#27303c;
}

.field input::placeholder{
    color:#c4c7cc;
}

/* ================= MOBILE ================= */

.country{
    width:80px;
    height:100%;

    flex-shrink:0;

    border-right:1.5px solid #e4e4e4;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:13px;

    color:#606269;

    font-size:15px;
    font-weight:700;
}

.arrow{
    width:9px;
    height:9px;

    border-right:1.5px solid #aaa;
    border-bottom:1.5px solid #aaa;

    transform:rotate(45deg);

    margin-top:-5px;
}

/* ================= PASSWORD ================= */

.password-field input{
    padding-right:45px;
}

.eye{
    position:absolute;

    right:15px;
    top:50%;

    transform:translateY(-50%);

    font-size:16px;

    color:#777;

    cursor:pointer;
}

/* ================= CAPTCHA ================= */

.captcha-box input{
    padding-right:100px;
}

.captcha-image{
    position:absolute;

    right:8px;
    top:50%;

    transform:translateY(-50%);

    width:70px;
    height:31px;

    background:#eeeeee;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;

    color:#333;

    letter-spacing:-2px;
}

/* ================= MAIN BUTTON ================= */

.main-button{
    width:100%;
    height:47px;

    border:0;

    border-radius:14px;

    background:#111111;

    color:#fff;

    font-family:Arial,Helvetica,sans-serif;

    font-size:17px;
    font-weight:800;

    cursor:pointer;
}

/* ================= FORGOT ================= */

.forgot{
    display:block;

    text-align:center;

    margin-top:17px;

    color:#e87512;

    font-size:16px;
    font-weight:700;

    text-decoration:none;
}

/* ================= LANGUAGE ================= */

.language{
    width:max-content;

    margin:22px auto 0;

    display:flex;
    align-items:center;

    gap:7px;

    color:#666;

    font-size:16px;

    cursor:pointer;

    user-select:none;
}

.globe{
    font-size:19px;
}

/* ================= LANGUAGE MENU ================= */

.language-menu{
    display:none;

    width:150px;

    margin:9px auto 0;

    background:#fff;

    border:1px solid #eeeeee;

    border-radius:11px;

    overflow:hidden;

    box-shadow:0 6px 20px rgba(0,0,0,.10);
}

.language-menu.show{
    display:block;
}

.language-menu button{
    width:100%;
    height:38px;

    border:0;

    background:#fff;

    font-family:Arial,Helvetica,sans-serif;

    font-size:14px;

    color:#333;

    cursor:pointer;
}

.language-menu button:active{
    background:#fff3ed;
}

/* ================= SECURITY ================= */

.security{
    width:100%;

    margin-top:23px;

    padding:13px 15px;

    border-radius:15px;

    background:#fff1e9;

    color:#a65e35;

    font-size:13px;

    line-height:20px;

    text-align:left;
}

.security-icon{
    margin-right:6px;
}

/* ================= SIGN UP ================= */

.signup{
    display:none;
}

/* ================= SIGNUP OTP ================= */

.otp-input{
    padding-right:90px !important;
}

.send-btn{
    position:absolute;

    right:6px;
    top:5px;

    height:35px;

    padding:0 17px;

    border:0;

    border-radius:11px;

    background:#f56d00;

    color:#fff;

    font-size:14px;

    cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:380px){

    .container{
        width:calc(100% - 40px);
    }

    .logo{
        width:70px;
        height:70px;

        margin-top:20px;
        margin-bottom:22px;
    }

    .title{
        font-size:24px;
        line-height:29px;
    }

    .subtitle{
        font-size:13px;
    }

    .field{
        height:47px;
    }

    .tab{
        font-size:16px;
    }

}

/* ================= VERY SMALL ================= */

@media(max-width:340px){

    .container{
        width:calc(100% - 30px);
    }

    .title{
        font-size:22px;
    }

    .subtitle{
        font-size:12px;
    }

}

</style>
</head>


<body>

<div class="page">

<div class="container">


<!-- ================= LOGO ================= -->

<div class="logo">

    <img src="Global.png" alt="GlobalPay">

</div>


<!-- ================= TITLE ================= -->

<h1 class="title" id="welcome">
    Welcome to GlobalPay
</h1>

<div class="subtitle" id="subtitle">
    Sign in to manage recharges, tasks and rewards
</div>


<!-- ================= TABS ================= -->

<div class="tabs">

    <button
        class="tab active"
        id="signinTab"
        onclick="showSignIn()">

        Sign In

    </button>

    <button
        class="tab"
        id="signupTab"
        onclick="showSignUp()">

        Sign Up

    </button>

</div>


<!-- ================= SIGN IN ================= -->

<div id="signinForm">


<label class="label" id="mobileLabel">
    Mobile number
</label>

<div class="field">

    <div class="country">

        <span>+91</span>

        <span class="arrow"></span>

    </div>

    <input
        type="tel"
        placeholder="Phone Number">

</div>


<label class="label" id="passwordLabel">
    Password
</label>

<div class="field password-field">

    <input
        type="password"
        id="loginPassword"
        placeholder="Password">

    <span
        class="eye"
        onclick="togglePassword('loginPassword',this)">
        👁
    </span>

</div>


<!-- CAPTCHA -->

<div class="field captcha-box">

    <input
        type="text"
        placeholder="Captcha">

    <div class="captcha-image">
        EƎCy
    </div>

</div>


<!-- SIGN IN -->

<button
    class="main-button"
    id="signinButton"
    onclick="demo()">

    Sign In

</button>


<!-- FORGOT -->

<a
    href="#"
    class="forgot"
    id="forgot">

    Forgot Password?

</a>

</div>


<!-- ================= SIGN UP ================= -->

<div
    id="signupForm"
    class="signup">


<label class="label" id="signupMobileLabel">
    Mobile number
</label>

<div class="field">

    <div class="country">

        <span>+91</span>

        <span class="arrow"></span>

    </div>

    <input
        type="tel"
        placeholder="Phone Number">

</div>


<div class="field password-field">

    <input
        type="password"
        id="signupPassword"
        placeholder="Password">

    <span
        class="eye"
        onclick="togglePassword('signupPassword',this)">
        👁
    </span>

</div>


<div class="field password-field">

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password">

    <span
        class="eye"
        onclick="togglePassword('confirmPassword',this)">
        👁
    </span>

</div>


<div class="field">

    <input
        type="text"
        value="22626WUH"
        readonly>

</div>


<div class="field">

    <input
        class="otp-input"
        type="text"
        placeholder="OTP Code">

    <button
        class="send-btn"
        type="button">

        Send

    </button>

</div>


<button
    class="main-button"
    id="signupButton"
    onclick="demo()">

    Sign Up

</button>


</div>


<!-- ================= LANGUAGE ================= -->

<div
    class="language"
    onclick="languageMenu()">

    <span class="globe">🌐</span>

    <span id="languageText">
        Language
    </span>

</div>


<!-- LANGUAGE MENU -->

<div
    class="language-menu"
    id="languageMenu">

    <button onclick="changeLanguage('en')">
        English
    </button>

    <button onclick="changeLanguage('hi')">
        हिन्दी
    </button>

</div>


<!-- ================= SECURITY ================= -->

<div class="security">

    <span class="security-icon">🛡️</span>

    <span id="security">
        Your funds and data are protected.
        GlobalPay never shares your information.
    </span>

</div>


</div>
</div>


<script>

/* ================= SIGN IN ================= */

function showSignIn(){

    document.getElementById("signinForm").style.display="block";

    document.getElementById("signupForm").style.display="none";

    document
        .getElementById("signinTab")
        .classList.add("active");

    document
        .getElementById("signupTab")
        .classList.remove("active");
}


/* ================= SIGN UP ================= */

function showSignUp(){

    document.getElementById("signinForm").style.display="none";

    document.getElementById("signupForm").style.display="block";

    document
        .getElementById("signinTab")
        .classList.remove("active");

    document
        .getElementById("signupTab")
        .classList.add("active");
}


/* ================= PASSWORD ================= */

function togglePassword(id,icon){

    const input=document.getElementById(id);

    if(input.type==="password"){

        input.type="text";

        icon.textContent="🙈";

    }else{

        input.type="password";

        icon.textContent="👁";

    }

}


/* ================= LANGUAGE MENU ================= */

function languageMenu(){

    document
        .getElementById("languageMenu")
        .classList.toggle("show");

}


/* ================= LANGUAGE ================= */

function changeLanguage(lang){

    if(lang==="hi"){

        document.documentElement.lang="hi";

        document.getElementById("welcome").innerText=
            "GlobalPay में आपका स्वागत है";

        document.getElementById("subtitle").innerText=
            "रिचार्ज, टास्क और रिवॉर्ड मैनेज करने के लिए साइन इन करें";

        document.getElementById("signinTab").innerText=
            "साइन इन";

        document.getElementById("signupTab").innerText=
            "साइन अप";

        document.getElementById("mobileLabel").innerText=
            "मोबाइल नंबर";

        document.getElementById("passwordLabel").innerText=
            "पासवर्ड";

        document.getElementById("signinButton").innerText=
            "साइन इन";

        document.getElementById("forgot").innerText=
            "पासवर्ड भूल गए?";

        document.getElementById("languageText").innerText=
            "भाषा";

        document.getElementById("security").innerText=
            "आपका फंड और डेटा सुरक्षित है। GlobalPay आपकी जानकारी कभी शेयर नहीं करता।";

        document.getElementById("signupMobileLabel").innerText=
            "मोबाइल नंबर";

        document.getElementById("signupButton").innerText=
            "साइन अप";

        localStorage.setItem("lang","hi");

    }else{

        document.documentElement.lang="en";

        document.getElementById("welcome").innerText=
            "Welcome to GlobalPay";

        document.getElementById("subtitle").innerText=
            "Sign in to manage recharges, tasks and rewards";

        document.getElementById("signinTab").innerText=
            "Sign In";

        document.getElementById("signupTab").innerText=
            "Sign Up";

        document.getElementById("mobileLabel").innerText=
            "Mobile number";

        document.getElementById("passwordLabel").innerText=
            "Password";

        document.getElementById("signinButton").innerText=
            "Sign In";

        document.getElementById("forgot").innerText=
            "Forgot Password?";

        document.getElementById("languageText").innerText=
            "Language";

        document.getElementById("security").innerText=
            "Your funds and data are protected. GlobalPay never shares your information.";

        document.getElementById("signupMobileLabel").innerText=
            "Mobile number";

        document.getElementById("signupButton").innerText=
            "Sign Up";

        localStorage.setItem("lang","en");
    }

    document
        .getElementById("languageMenu")
        .classList.remove("show");
}


/* ================= LOAD LANGUAGE ================= */

window.addEventListener("load",function(){

    const savedLanguage=localStorage.getItem("lang");

    if(savedLanguage==="hi"){
        changeLanguage("hi");
    }else{
        changeLanguage("en");
    }

});


/* ================= DEMO ================= */

function demo(){

    alert("Demo UI only");

}

</script>

</body>
  </html>
