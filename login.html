<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>GlobalPay - Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    color:#172235;
    background:#fffdfb;
}

/* Background */
.page{
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    background:
        linear-gradient(rgba(245,238,232,.35) 1px,transparent 1px),
        linear-gradient(90deg,rgba(245,238,232,.35) 1px,transparent 1px),
        #fffdfb;
    background-size:42px 42px;
}

/* Soft background glow */
.page::before{
    content:"";
    position:fixed;
    width:330px;
    height:330px;
    top:170px;
    left:-160px;
    border-radius:50%;
    background:rgba(255,145,50,.07);
    filter:blur(45px);
    pointer-events:none;
}

.page::after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    right:-160px;
    bottom:100px;
    border-radius:50%;
    background:rgba(255,145,50,.05);
    filter:blur(45px);
    pointer-events:none;
}

/* Main container */
.container{
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:76px 48px 38px;
    text-align:center;
}

/* Logo */
.logo{
    width:142px;
    height:142px;
    margin:0 auto 38px;
    border-radius:32px;
    background:#eef1f5;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 15px 30px rgba(0,0,0,.08),
        inset 0 0 15px rgba(255,255,255,.8);
    overflow:hidden;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.logo-placeholder{
    font-size:54px;
    font-weight:900;
    color:#12325e;
}

/* Heading */
h1{
    font-size:42px;
    line-height:1.15;
    font-weight:800;
    margin-bottom:20px;
    letter-spacing:-1px;
}

.subtitle{
    color:#9299a5;
    font-size:23px;
    line-height:1.45;
    margin-bottom:58px;
}

/* Tabs */
.tabs{
    width:100%;
    height:72px;
    background:#fff1eb;
    border-radius:18px;
    padding:5px;
    display:flex;
    margin-bottom:40px;
}

.tab{
    flex:1;
    border:0;
    background:transparent;
    border-radius:15px;
    font-size:22px;
    font-weight:700;
    color:#9da2ab;
    cursor:pointer;
}

.tab.active{
    background:#fff;
    color:#ef730d;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

/* Form */
.form{
    text-align:left;
}

.field-label{
    display:block;
    color:#647287;
    font-size:20px;
    font-weight:700;
    margin:0 0 10px;
}

/* Mobile field */
.phone-box{
    width:100%;
    height:90px;
    display:flex;
    align-items:center;
    border:2px solid #e4e4e4;
    border-radius:22px;
    background:#fff;
    overflow:hidden;
    margin-bottom:38px;
}

.country{
    width:153px;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:25px;
    color:#60646b;
    font-size:21px;
    font-weight:700;
    border-right:2px solid #e5e5e5;
}

.arrow{
    width:13px;
    height:13px;
    border-right:2px solid #aaa;
    border-bottom:2px solid #aaa;
    transform:rotate(45deg);
    margin-top:-6px;
}

.phone-input{
    flex:1;
    height:100%;
    border:0;
    outline:0;
    padding:0 24px;
    font-size:22px;
    color:#222;
    background:#fff;
}

.phone-input::placeholder,
.input::placeholder{
    color:#c2c5ca;
}

/* Normal input */
.input-box{
    position:relative;
    margin-bottom:38px;
}

.input{
    width:100%;
    height:90px;
    border:2px solid #e4e4e4;
    border-radius:22px;
    outline:none;
    background:#fff;
    padding:0 55px 0 24px;
    font-size:22px;
    color:#222;
}

.eye{
    position:absolute;
    right:24px;
    top:50%;
    transform:translateY(-50%);
    font-size:21px;
    color:#606060;
    cursor:pointer;
}

/* Captcha */
.captcha-box{
    width:100%;
    height:90px;
    border:2px solid #e4e4e4;
    border-radius:22px;
    background:#fff;
    display:flex;
    align-items:center;
    overflow:hidden;
    margin-bottom:38px;
}

.captcha-input{
    flex:1;
    height:100%;
    border:0;
    outline:0;
    padding:0 24px;
    font-size:22px;
}

.captcha-code{
    width:116px;
    height:58px;
    margin-right:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f1f1;
    font-size:27px;
    color:#222;
    letter-spacing:-2px;
}

/* OTP */
.otp-box{
    width:100%;
    height:90px;
    border:2px solid #e4e4e4;
    border-radius:22px;
    background:#fff;
    display:flex;
    align-items:center;
    overflow:hidden;
    margin-bottom:38px;
}

.otp-input{
    flex:1;
    height:100%;
    border:0;
    outline:0;
    padding:0 24px;
    font-size:22px;
}

.send-btn{
    height:58px;
    min-width:96px;
    margin-right:12px;
    border:0;
    border-radius:17px;
    background:#ff7000;
    color:#fff;
    font-size:19px;
    cursor:pointer;
}

/* Main button */
.main-btn{
    width:100%;
    height:86px;
    border:none;
    border-radius:22px;
    background:#111;
    color:#fff;
    font-size:25px;
    font-weight:800;
    cursor:pointer;
}

/* Links */
.forgot{
    display:block;
    text-align:center;
    margin-top:31px;
    color:#ed710d;
    font-size:20px;
    font-weight:700;
    text-decoration:none;
}

/* Language */
.language{
    text-align:center;
    margin-top:36px;
    color:#666;
    font-size:21px;
    cursor:pointer;
    user-select:none;
}

.language-menu{
    display:none;
    width:170px;
    margin:12px auto 0;
    background:#fff;
    border:1px solid #eee;
    border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.10);
    overflow:hidden;
}

.language-menu button{
    width:100%;
    height:48px;
    border:0;
    background:#fff;
    font-size:17px;
    color:#444;
}

.language-menu button:hover{
    background:#fff3eb;
    color:#ed710d;
}

/* Security notice */
.security{
    margin-top:38px;
    padding:22px 24px;
    border-radius:20px;
    background:#fff1e9;
    color:#ad5729;
    font-size:18px;
    line-height:1.55;
    text-align:left;
}

/* Sign up form hidden initially */
.signup-form{
    display:none;
}

/* Desktop */
@media(min-width:700px){
    .container{
        padding-top:85px;
    }
}

/* Mobile — closely matching screenshot */
@media(max-width:600px){

    .container{
        max-width:none;
        padding:94px 47px 35px;
    }

    .logo{
        width:140px;
        height:140px;
        margin-bottom:39px;
        border-radius:31px;
    }

    h1{
        font-size:42px;
        white-space:nowrap;
        margin-left:-20px;
        margin-right:-20px;
    }

    .subtitle{
        font-size:22px;
        white-space:nowrap;
        margin-left:-25px;
        margin-right:-25px;
        margin-bottom:59px;
    }

    .tabs{
        height:72px;
        border-radius:18px;
        margin-bottom:39px;
    }

    .tab{
        font-size:21px;
    }

    .field-label{
        font-size:20px;
    }

    .phone-box,
    .input-box,
    .captcha-box,
    .otp-box{
        height:90px;
    }

    .country{
        width:153px;
        font-size:20px;
    }

    .phone-input,
    .input,
    .captcha-input,
    .otp-input{
        font-size:21px;
    }

    .main-btn{
        height:86px;
        font-size:24px;
        border-radius:21px;
    }

    .security{
        font-size:18px;
    }
}

/* Smaller phones */
@media(max-width:380px){

    .container{
        padding-left:32px;
        padding-right:32px;
    }

    h1{
        font-size:34px;
    }

    .subtitle{
        font-size:18px;
    }

    .country{
        width:125px;
    }
}
</style>
</head>

<body>

<div class="page">

    <main class="container">

        <!-- LOGO -->
        <div class="logo">
            <!-- Baad mein apna logo lagao:
            <img src="logo.png" alt="GlobalPay Logo">
            -->
            <div class="logo-placeholder">G</div>
        </div>

        <!-- HEADER -->
        <h1 id="title">Welcome to GlobalPay</h1>

        <p class="subtitle" id="subtitle">
            Sign in to manage recharges, tasks and rewards
        </p>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab active"
                    id="signinTab"
                    onclick="showSignIn()">
                Sign In
            </button>

            <button class="tab"
                    id="signupTab"
                    onclick="showSignUp()">
                Sign Up
            </button>
        </div>


        <!-- ================= SIGN IN ================= -->

        <form class="form signin-form"
              id="signinForm"
              onsubmit="return false;">

            <label class="field-label">
                Mobile number
            </label>

            <div class="phone-box">

                <div class="country">
                    <span>+91</span>
                    <span class="arrow"></span>
                </div>

                <input
                    class="phone-input"
                    type="tel"
                    maxlength="10"
                    placeholder="Phone Number">
            </div>


            <div class="input-box">

                <input
                    class="input"
                    id="loginPassword"
                    type="password"
                    placeholder="Password">

                <span class="eye"
                      onclick="togglePassword('loginPassword',this)">
                    ◡
                </span>

            </div>


            <div class="captcha-box">

                <input
                    class="captcha-input"
                    type="text"
                    placeholder="Captcha">

                <div class="captcha-code">
                    EJCy
                </div>

            </div>


            <button class="main-btn"
                    type="button">
                Sign In
            </button>

            <a href="#" class="forgot">
                Forgot Password?
            </a>

        </form>


        <!-- ================= SIGN UP ================= -->

        <form class="form signup-form"
              id="signupForm"
              onsubmit="return false;">

            <label class="field-label">
                Mobile number
            </label>

            <div class="phone-box">

                <div class="country">
                    <span>+91</span>
                    <span class="arrow"></span>
                </div>

                <input
                    class="phone-input"
                    type="tel"
                    maxlength="10"
                    placeholder="Phone Number">
            </div>


            <div class="input-box">

                <input
                    class="input"
                    id="signupPassword"
                    type="password"
                    placeholder="Password">

                <span class="eye"
                      onclick="togglePassword('signupPassword',this)">
                    ◡
                </span>

            </div>


            <div class="input-box">

                <input
                    class="input"
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm Password">

                <span class="eye"
                      onclick="togglePassword('confirmPassword',this)">
                    ◡
                </span>

            </div>


            <div class="captcha-box">

                <input
                    class="captcha-input"
                    type="text"
                    value="22626WUH"
                    readonly>

            </div>


            <div class="otp-box">

                <input
                    class="otp-input"
                    type="text"
                    maxlength="6"
                    placeholder="OTP Code">

                <button
                    class="send-btn"
                    type="button">
                    Send
                </button>

            </div>


            <button class="main-btn"
                    type="button">
                Sign Up
            </button>

        </form>


        <!-- LANGUAGE -->
        <div class="language"
             onclick="toggleLanguage()">

            🌐 &nbsp; <span id="languageText">Language</span>

        </div>

        <div class="language-menu" id="languageMenu">

            <button onclick="setLanguage('en')">
                English
            </button>

            <button onclick="setLanguage('hi')">
                हिन्दी
            </button>

        </div>


        <!-- SECURITY -->
        <div class="security" id="securityText">
            🛡️ &nbsp; Your funds and data are protected.
            GlobalPay never shares your information.
        </div>

    </main>

</div>


<script>

/* ================= TAB SWITCH ================= */

function showSignIn(){

    document.getElementById("signinForm").style.display = "block";
    document.getElementById("signupForm").style.display = "none";

    document.getElementById("signinTab").classList.add("active");
    document.getElementById("signupTab").classList.remove("active");
}


function showSignUp(){

    document.getElementById("signinForm").style.display = "none";
    document.getElementById("signupForm").style.display = "block";

    document.getElementById("signinTab").classList.remove("active");
    document.getElementById("signupTab").classList.add("active");
}


/* ================= PASSWORD EYE ================= */

function togglePassword(id, icon){

    const input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
        icon.textContent = "◉";
    }else{
        input.type = "password";
        icon.textContent = "◡";
    }
}


/* ================= LANGUAGE ================= */

function toggleLanguage(){

    const menu = document.getElementById("languageMenu");

    if(menu.style.display === "block"){
        menu.style.display = "none";
    }else{
        menu.style.display = "block";
    }
}


function setLanguage(lang){

    if(lang === "hi"){

        document.getElementById("title").textContent =
            "GlobalPay में आपका स्वागत है";

        document.getElementById("subtitle").textContent =
            "रीचार्ज, टास्क और रिवॉर्ड मैनेज करने के लिए साइन इन करें";

        document.getElementById("languageText").textContent =
            "भाषा";

        document.getElementById("securityText").innerHTML =
            "🛡️ &nbsp; आपका पैसा और डेटा सुरक्षित है। " +
            "GlobalPay आपकी जानकारी साझा नहीं करता।";

    }else{

        document.getElementById("title").textContent =
            "Welcome to GlobalPay";

        document.getElementById("subtitle").textContent =
            "Sign in to manage recharges, tasks and rewards";

        document.getElementById("languageText").textContent =
            "Language";

        document.getElementById("securityText").innerHTML =
            "🛡️ &nbsp; Your funds and data are protected. " +
            "GlobalPay never shares your information.";
    }

    document.getElementById("languageMenu").style.display = "none";
}


/* Default page */
showSignIn();

</script>

</body>
  </html>
