<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Deposit - GlobalPay</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b1020;
  color:#fff;
}

.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  padding-bottom:30px;
}

.header{
  height:70px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 18px;
  background:#111827;
  border-bottom:1px solid #263044;
}

.back{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#1e293b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
}

.title{
  font-size:20px;
  font-weight:800;
}

.sub{
  color:#94a3b8;
  font-size:11px;
  margin-top:3px;
}

.content{
  padding:18px;
}

.card{
  background:#111827;
  border:1px solid #263044;
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
}

.heading{
  font-size:17px;
  font-weight:800;
  margin-bottom:14px;
}

.amount{
  width:100%;
  height:55px;
  background:#0f172a;
  border:1px solid #334155;
  border-radius:14px;
  color:white;
  padding:0 15px;
  font-size:18px;
  outline:none;
}

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:12px;
}

.quick button{
  background:#172033;
  border:1px solid #334155;
  color:white;
  padding:12px 4px;
  border-radius:12px;
  font-weight:700;
}

.quick button.active{
  background:#6d28d9;
  border-color:#8b5cf6;
}

.error{
  color:#f87171;
  font-size:12px;
  margin-top:8px;
  display:none;
}

.pay{
  width:100%;
  height:55px;
  margin-top:15px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#7c3aed,#9333ea);
  color:white;
  font-size:16px;
  font-weight:900;
}

/* HISTORY */

.history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.history-head h2{
  font-size:18px;
}

.view{
  color:#a78bfa;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.history-item{
  background:#0f172a;
  border:1px solid #263044;
  border-radius:15px;
  padding:14px;
  margin-bottom:10px;
}

.top{
  display:flex;
  justify-content:space-between;
}

.money{
  font-size:18px;
  font-weight:900;
}

.status{
  font-size:11px;
  padding:5px 9px;
  border-radius:8px;
  font-weight:800;
}

.pending{
  color:#facc15;
  background:#422006;
}

.success{
  color:#4ade80;
  background:#052e16;
}

.rejected{
  color:#f87171;
  background:#450a0a;
}

.details{
  color:#94a3b8;
  font-size:12px;
  line-height:1.7;
  margin-top:8px;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:20px;
  font-size:13px;
}

/* FULL HISTORY */

.full-history{
  position:fixed;
  inset:0;
  background:#0b1020;
  z-index:999;
  display:none;
  overflow-y:auto;
}

.full-history.show{
  display:block;
}

.full-header{
  height:70px;
  background:#111827;
  border-bottom:1px solid #263044;
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 18px;
  position:sticky;
  top:0;
}

.full-content{
  padding:18px;
}

.close{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#1e293b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="back"
       onclick="window.location.href='wallet.html'">
    ‹
  </div>

  <div>
    <div class="title">Deposit</div>
    <div class="sub">GlobalPay</div>
  </div>

</header>


<div class="content">

  <!-- AMOUNT -->

  <div class="card">

    <div class="heading">
      Enter Deposit Amount
    </div>

    <input
      id="amount"
      class="amount"
      type="number"
      min="300"
      max="100000"
      placeholder="Enter amount ₹">

    <div class="quick">

      <button onclick="choose(300)">₹300</button>
      <button onclick="choose(500)">₹500</button>
      <button onclick="choose(1000)">₹1,000</button>
      <button onclick="choose(5000)">₹5,000</button>
      <button onclick="choose(10000)">₹10,000</button>

    </div>

    <div id="amountError" class="error">
      Minimum ₹300 and maximum ₹1,00,000 allowed.
    </div>

    <button class="pay" onclick="goPay()">
      Pay
    </button>

  </div>


  <!-- HISTORY -->

  <div class="card">

    <div class="history-head">

      <h2>Deposit History</h2>

      <span class="view"
            onclick="openHistory()">
        View All
      </span>

    </div>

    <div id="history">
      <div class="empty">
        Login to view deposit history
      </div>
    </div>

  </div>

</div>

</div>


<!-- FULL SCREEN HISTORY -->

<div id="fullHistory" class="full-history">

  <div class="full-header">

    <div class="close"
         onclick="closeHistory()">
      ‹
    </div>

    <div>
      <div class="title">Deposit History</div>
      <div class="sub">All transactions</div>
    </div>

  </div>

  <div class="full-content">

    <div id="fullHistoryList"></div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:"AIzaSyCA6csT0NBPNwOyA269hOfdgmt9DYDoqQ",

  authDomain:"globalpay-d31dd.firebaseapp.com",

  projectId:"globalpay-d31dd",

  storageBucket:"globalpay-d31dd.firebasestorage.app",

  messagingSenderId:"862227027913",

  appId:"1:862227027913:web:f643dc5cb4b014fd80ba18"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

let currentUser=null;


/* AMOUNT */

window.choose=function(value){

  document.getElementById("amount").value=value;

  document.querySelectorAll(".quick button")
    .forEach(b=>b.classList.remove("active"));

  event.target.classList.add("active");

  document.getElementById("amountError")
    .style.display="none";
};


/* PAY */

window.goPay=function(){

  const amount=Number(
    document.getElementById("amount").value
  );

  const error=
    document.getElementById("amountError");

  if(
    !Number.isFinite(amount) ||
    amount<300 ||
    amount>100000
  ){

    error.style.display="block";
    return;
  }

  /*
    Selected amount is passed to payment page.
  */

  window.location.href=
    "deposit-pay.html?amount="+
    encodeURIComponent(amount);
};


/* HISTORY */

onAuthStateChanged(auth,user=>{

  if(!user){

    return;
  }

  currentUser=user;

  loadHistory();

});


function loadHistory(){

  const q=query(
    collection(
      db,
      "users",
      currentUser.uid,
      "depositRequests"
    ),
    orderBy("createdAt","desc")
  );


  onSnapshot(q,snapshot=>{

    const history=
      document.getElementById("history");

    const full=
      document.getElementById("fullHistoryList");

    history.innerHTML="";
    full.innerHTML="";


    if(snapshot.empty){

      history.innerHTML=
        `<div class="empty">
          No deposit history
        </div>`;

      full.innerHTML=
        `<div class="empty">
          No deposit history
        </div>`;

      return;
    }


    snapshot.forEach(docSnap=>{

      const data=docSnap.data();

      const item=
        createHistoryItem(data);

      history.appendChild(
        item.cloneNode(true)
      );

      full.appendChild(item);

    });

  });

}


/* HISTORY ITEM */

function createHistoryItem(data){

  const div=document.createElement("div");

  div.className="history-item";

  let status=
    String(data.status||"pending")
    .toLowerCase();

  let statusText="Pending";
  let statusClass="pending";

  if(
    status==="success" ||
    status==="successful" ||
    status==="approved"
  ){

    statusText="Successful";
    statusClass="success";

  }

  if(
    status==="rejected" ||
    status==="failed"
  ){

    statusText="Rejected";
    statusClass="rejected";

  }


  let date="Processing";

  if(data.createdAt){

    try{

      date=data.createdAt
        .toDate()
        .toLocaleString("en-IN",{
          day:"2-digit",
          month:"short",
          year:"numeric",
          hour:"2-digit",
          minute:"2-digit"
        });

    }catch(e){}

  }


  div.innerHTML=`

    <div class="top">

      <div class="money">
        ₹${Number(data.amount||0)
          .toLocaleString("en-IN")}
      </div>

      <div class="status ${statusClass}">
        ${statusText}
      </div>

    </div>

    <div class="details">

      UTR:
      <b>${data.utr||"-"}</b>
      <br>

      Date:
      ${date}

      ${
        statusClass==="success"
        ?
        `<br>Tokens:
         <b>${Number(
           data.tokens || data.amount || 0
         ).toLocaleString("en-IN")}</b>`
        :
        ""
      }

    </div>

  `;

  return div;
}


/* FULL SCREEN */

window.openHistory=function(){

  document
    .getElementById("fullHistory")
    .classList.add("show");

  document.body.style.overflow="hidden";

};


window.closeHistory=function(){

  document
    .getElementById("fullHistory")
    .classList.remove("show");

  document.body.style.overflow="";

};

</script>

</body>
  </html>
