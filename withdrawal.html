<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GlobalPay - Withdrawal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f8f8f6;
    color:#132342;
    padding-bottom:85px;
}

.app{
    width:100%;
    max-width:650px;
    margin:auto;
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

.header{
    height:72px;
    background:#111d32;
    color:white;

    display:flex;
    align-items:center;

    padding:0 16px;

    position:sticky;
    top:0;
    z-index:20;
}

.back{
    width:42px;
    height:42px;

    border:0;
    background:transparent;

    color:white;
    font-size:34px;

    cursor:pointer;
}

.header-title{
    flex:1;

    text-align:center;

    font-size:23px;
    font-weight:800;
}

.header-logo{
    width:105px;
    max-height:43px;
    object-fit:contain;
}


/* =========================
   BALANCE CARD
========================= */

.balance-card{
    margin:16px;
    padding:22px;

    min-height:190px;

    border-radius:22px;

    color:white;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 90% 20%,
            rgba(244,190,52,.35),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #111b2d,
            #18263d 60%,
            #101a2b
        );

    box-shadow:
        0 12px 28px rgba(0,0,0,.16);
}

.balance-card:after{
    content:"";

    position:absolute;

    width:350px;
    height:120px;

    right:-130px;
    bottom:-40px;

    border:
        2px solid
        rgba(245,194,61,.45);

    border-radius:50%;

    box-shadow:
        0 0 0 12px
        rgba(245,194,61,.08),

        0 0 0 25px
        rgba(245,194,61,.05);
}

.balance-label{
    font-size:14px;
    opacity:.8;
}

.balance{
    font-size:35px;
    font-weight:900;

    margin:6px 0 22px;
}

.limits{
    display:flex;
    gap:25px;
}

.limit{
    flex:1;
}

.limit-label{
    font-size:12px;
    opacity:.72;

    margin-bottom:5px;
}

.limit-value{
    font-size:16px;
    font-weight:800;
}

.divider{
    width:1px;

    background:
        rgba(255,255,255,.3);
}


/* =========================
   CONTENT
========================= */

.content{
    padding:0 16px;
}

.heading{
    font-size:20px;
    font-weight:850;

    margin:18px 0 13px;
}


/* =========================
   BANK / UPI TABS
========================= */

.tabs{
    display:flex;
    gap:10px;

    margin-bottom:14px;
}

.tab{
    flex:1;

    height:56px;

    border-radius:15px;

    border:
        1px solid #d9dfe8;

    background:white;

    color:#132342;

    font-size:17px;
    font-weight:800;

    cursor:pointer;
}

.tab.active{
    background:#142239;
    color:white;

    border-color:#142239;
}


/* =========================
   FORM
========================= */

.form-card{
    background:white;

    border:
        1px solid #e0e4ea;

    border-radius:19px;

    padding:18px;

    box-shadow:
        0 7px 20px
        rgba(0,0,0,.04);
}

.form-title{
    font-size:21px;
    font-weight:850;

    margin-bottom:17px;
}

.form-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:13px 16px;
}

.field label{
    display:block;

    font-size:13px;
    font-weight:750;

    margin-bottom:7px;
}

.input{
    width:100%;
    height:51px;

    border:
        1px solid #d4dbe5;

    border-radius:12px;

    padding:0 13px;

    font-size:14px;

    color:#132342;

    outline:none;

    background:white;
}

.input:focus{
    border-color:#142239;

    box-shadow:
        0 0 0 3px
        rgba(20,34,57,.07);
}

.error{
    min-height:17px;

    color:#dc2626;

    font-size:11px;

    margin-top:4px;
}

.full{
    grid-column:1 / -1;
}


/* =========================
   BUTTON
========================= */

.withdraw-btn{
    width:100%;
    height:58px;

    margin-top:5px;

    border:0;

    border-radius:14px;

    background:#142239;

    color:white;

    font-size:16px;
    font-weight:850;

    cursor:pointer;

    box-shadow:
        0 8px 18px
        rgba(20,34,57,.18);
}

.withdraw-btn:active{
    transform:scale(.98);
}


/* =========================
   MESSAGE
========================= */

.message{
    display:none;

    margin-top:13px;

    padding:13px;

    border-radius:12px;

    font-size:13px;
    font-weight:700;
}

.message.error-message{
    display:block;

    background:#fee2e2;
    color:#b91c1c;
}


/* =========================
   PENDING RESULT
========================= */

.result{
    display:none;

    margin-top:14px;

    padding:16px;

    border-radius:16px;

    background:#fff8d9;

    border:
        1px solid #efd36a;
}

.result-title{
    color:#a16207;

    font-size:17px;
    font-weight:850;

    margin-bottom:10px;
}

.result-row{
    display:flex;

    justify-content:space-between;

    gap:15px;

    padding:6px 0;

    font-size:13px;
}

.result-row span:first-child{
    color:#707070;
}

.result-row span:last-child{
    font-weight:750;

    text-align:right;

    word-break:break-all;
}


/* =========================
   HISTORY HEADER
========================= */

.history-header{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin:22px 0 12px;
}

.history-title{
    font-size:20px;
    font-weight:850;
}

.view-all{
    color:#132b59;

    font-size:13px;
    font-weight:750;

    cursor:pointer;
}

.view-all:active{
    opacity:.6;
}


/* =========================
   HISTORY
========================= */

.history{
    display:flex;

    flex-direction:column;

    gap:11px;
}

.history-card{
    background:white;

    border:
        1px solid #e0e4ea;

    border-radius:17px;

    padding:15px;
}

.history-top{
    display:flex;

    justify-content:space-between;
    align-items:flex-start;

    gap:10px;
}

.history-method{
    font-size:14px;
    font-weight:800;

    margin-bottom:3px;
}

.history-amount{
    font-size:21px;
    font-weight:900;
}

.status{
    padding:7px 11px;

    border-radius:20px;

    font-size:11px;
    font-weight:850;

    white-space:nowrap;
}

.pending{
    background:#fff2c7;
    color:#b77900;
}

.success{
    background:#d9f8df;
    color:#13833b;
}

.failed{
    background:#ffdcdc;
    color:#c62828;
}

.history-info{
    margin-top:8px;

    color:#687386;

    font-size:11px;

    line-height:1.6;
}

.empty{
    background:white;

    border:
        1px solid #e0e4ea;

    border-radius:16px;

    padding:28px;

    text-align:center;

    color:#8a94a4;

    font-size:13px;
}


/* =========================
   BOTTOM NAVIGATION
========================= */

.bottom-nav{
    position:fixed;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:100%;
    max-width:480px;

    height:75px;

    background:white;

    border-top:
        1px solid #e2e5e9;

    display:flex;

    justify-content:space-around;
    align-items:center;

    z-index:50;
}

.nav-item{
    flex:1;

    text-align:center;

    color:#7b8799;

    font-size:11px;
    font-weight:700;

    cursor:pointer;
}

.nav-icon{
    width:24px;
    height:24px;

    display:block;

    margin:
        0 auto 4px;
}

.nav-item.active{
    color:#142239;
}


/* ==================================================
   FULL SCREEN HISTORY
================================================== */

.full-history-page{
    display:none;

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:#f8f8f6;

    z-index:9999;

    overflow-y:auto;
}


/* FULL HISTORY HEADER */

.full-history-header{
    height:72px;

    background:#111d32;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 16px;

    position:sticky;

    top:0;

    z-index:10;
}

.history-back{
    width:42px;
    height:42px;

    border:0;

    background:transparent;

    color:white;

    font-size:34px;

    cursor:pointer;
}

.full-history-title{
    font-size:21px;
    font-weight:850;
}


/* FULL HISTORY CONTENT */

.full-history-content{
    width:100%;

    max-width:650px;

    margin:auto;

    padding:18px 16px 30px;
}

.full-history-count{
    font-size:15px;

    font-weight:800;

    color:#132342;

    margin-bottom:14px;
}


/* FULL HISTORY CARD */

.full-history-card{
    background:white;

    border:
        1px solid #e0e4ea;

    border-radius:18px;

    padding:17px;

    margin-bottom:12px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.04);
}

.full-history-top{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:12px;
}

.full-history-method{
    font-size:15px;

    font-weight:800;

    margin-bottom:5px;
}

.full-history-amount{
    font-size:23px;

    font-weight:900;

    color:#132342;
}

.full-history-status{
    padding:7px 11px;

    border-radius:20px;

    font-size:11px;

    font-weight:850;

    white-space:nowrap;
}

.full-pending{
    background:#fff2c7;
    color:#b77900;
}

.full-success{
    background:#d9f8df;
    color:#13833b;
}

.full-failed{
    background:#ffdcdc;
    color:#c62828;
}

.full-history-details{
    margin-top:12px;

    padding-top:11px;

    border-top:
        1px solid #edf0f3;

    color:#687386;

    font-size:12px;

    line-height:1.8;
}

.full-history-details strong{
    color:#26364f;
}

.no-history{
    background:white;

    border:
        1px solid #e0e4ea;

    border-radius:18px;

    padding:35px 20px;

    text-align:center;

    color:#8a94a4;
}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .header-logo{
        width:88px;
    }

    .header-title{
        font-size:21px;
    }

    .balance-card{
        margin:13px;

        padding:18px;
    }

    .content{
        padding:0 13px;
    }

    .balance{
        font-size:31px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .limit-value{
        font-size:14px;
    }

    .full-history-content{
        padding:
            16px 13px 30px;
    }
}

</style>
</head>


<body>


<!-- ==================================================
     MAIN WITHDRAWAL PAGE
================================================== -->

<div class="app" id="mainWithdrawalPage">


    <!-- HEADER -->

    <header class="header">

        <button
            class="back"
            onclick="goBack()">

            ‹

        </button>


        <div class="header-title">
            Withdrawal
        </div>


        <img
            src="Global.png"
            class="header-logo"
            alt="GlobalPay">

    </header>



    <!-- BALANCE -->

    <div class="balance-card">

        <div class="balance-label">
            Available Balance
        </div>


        <div
            class="balance"
            id="balance">

            ₹12,450.00

        </div>


        <div class="limits">

            <div class="limit">

                <div class="limit-label">
                    Minimum Withdrawal
                </div>

                <div class="limit-value">
                    ₹500
                </div>

            </div>


            <div class="divider"></div>


            <div class="limit">

                <div class="limit-label">
                    Maximum Withdrawal
                </div>

                <div class="limit-value">
                    ₹50,000
                </div>

            </div>

        </div>

    </div>



    <main class="content">


        <div class="heading">
            Withdraw Money
        </div>


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                id="bankTab"
                onclick="showBank()">

                🏦 &nbsp; Bank

            </button>


            <button
                class="tab"
                id="upiTab"
                onclick="showUPI()">

                UPI

            </button>

        </div>



        <!-- ==================================================
             BANK FORM
        ================================================== -->

        <div
            class="form-card"
            id="bankForm">


            <div class="form-title">
                Bank Withdrawal
            </div>


            <div class="form-grid">


                <!-- BANK NAME -->

                <div class="field">

                    <label>
                        Bank Name
                    </label>

                    <input
                        class="input"
                        id="bankName"
                        type="text"
                        placeholder="Select / Enter Bank">

                    <div
                        class="error"
                        id="bankNameError">
                    </div>

                </div>


                <!-- HOLDER NAME -->

                <div class="field">

                    <label>
                        Holder Name
                    </label>

                    <input
                        class="input"
                        id="holderName"
                        type="text"
                        placeholder="Enter Account Holder Name">

                    <div
                        class="error"
                        id="holderError">
                    </div>

                </div>


                <!-- ACCOUNT -->

                <div class="field">

                    <label>
                        Account Number
                    </label>

                    <input
                        class="input"
                        id="accountNo"
                        type="password"
                        inputmode="numeric"
                        placeholder="Enter Account Number">

                    <div
                        class="error"
                        id="accountError">
                    </div>

                </div>


                <!-- CONFIRM ACCOUNT -->

                <div class="field">

                    <label>
                        Confirm Account Number
                    </label>

                    <input
                        class="input"
                        id="confirmAccount"
                        type="password"
                        inputmode="numeric"
                        placeholder="Re-enter Account Number">

                    <div
                        class="error"
                        id="confirmError">
                    </div>

                </div>


                <!-- IFSC -->

                <div class="field">

                    <label>
                        IFSC Code
                    </label>

                    <input
                        class="input"
                        id="ifsc"
                        type="text"
                        maxlength="11"
                        placeholder="Enter IFSC Code">

                    <div
                        class="error"
                        id="ifscError">
                    </div>

                </div>


                <!-- AMOUNT -->

                <div class="field">

                    <label>
                        Withdrawal Amount
                    </label>

                    <input
                        class="input"
                        id="bankAmount"
                        type="number"
                        min="500"
                        max="50000"
                        placeholder="Enter Amount">

                    <div
                        class="error"
                        id="bankAmountError">
                    </div>

                </div>


                <!-- BUTTON -->

                <div class="full">

                    <button
                        class="withdraw-btn"
                        onclick="submitBank()">

                        ➤ &nbsp;
                        Request Withdrawal

                    </button>

                </div>

            </div>


            <div
                id="bankMessage"
                class="message">
            </div>


            <div
                id="bankResult"
                class="result">
            </div>

        </div>



        <!-- ==================================================
             UPI FORM
        ================================================== -->

        <div
            class="form-card"
            id="upiForm"
            style="display:none;">


            <div class="form-title">
                UPI Withdrawal
            </div>


            <div class="field">

                <label>
                    Withdrawal Amount
                </label>

                <input
                    class="input"
                    id="upiAmount"
                    type="number"
                    min="500"
                    max="50000"
                    placeholder="Enter Amount">

                <div
                    class="error"
                    id="upiAmountError">
                </div>

            </div>


            <br>


            <div class="field">

                <label>
                    UPI ID
                </label>

                <input
                    class="input"
                    id="upiId"
                    type="text"
                    placeholder="example@upi">

                <div
                    class="error"
                    id="upiError">
                </div>

            </div>


            <button
                class="withdraw-btn"
                onclick="submitUPI()">

                ➤ &nbsp;
                Request Withdrawal

            </button>


            <div
                id="upiMessage"
                class="message">
            </div>


            <div
                id="upiResult"
                class="result">
            </div>

        </div>



        <!-- ==================================================
             HISTORY
        ================================================== -->

        <div class="history-header">

            <div class="history-title">
                Withdrawal History
            </div>


            <div
                class="view-all"
                onclick="openFullHistory()">

                View All ›

            </div>

        </div>


        <div
            id="history"
            class="history">
        </div>


    </main>

</div>



<!-- ==================================================
     BOTTOM NAVIGATION
================================================== -->

<nav class="bottom-nav">


    <div
        class="nav-item"
        onclick="goTo('home.html')">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path d="M3 11.5L12 4l9 7.5"/>
            <path d="M5 10v10h14V10"/>

        </svg>

        Home

    </div>



    <div
        class="nav-item"
        onclick="goTo('buy.html')">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path d="M6 7h12l1 13H5L6 7z"/>
            <path d="M9 7a3 3 0 0 1 6 0"/>

        </svg>

        Buy

    </div>



    <div
        class="nav-item"
        onclick="goTo('rewards.html')">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path d="M12 7v14"/>
            <path d="M3 7h18v5H3z"/>
            <path d="M5 12v8h14v-8"/>

        </svg>

        Rewards

    </div>



    <div
        class="nav-item"
        onclick="goTo('wallet.html')">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path d="M3 6h18v14H3z"/>
            <path d="M3 6l2-3h14l2 3"/>
            <path d="M16 13h3"/>

        </svg>

        Wallet

    </div>



    <div
        class="nav-item active"
        onclick="goTo('my.html')">

        <svg
            class="nav-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <circle
                cx="12"
                cy="8"
                r="4"/>

            <path
                d="M4 21a8 8 0 0 1 16 0"/>

        </svg>

        My

    </div>

</nav>



<!-- ==================================================
     FULL SCREEN HISTORY PAGE
================================================== -->

<div
    id="fullHistoryPage"
    class="full-history-page">


    <!-- FULL HEADER -->

    <div class="full-history-header">


        <button
            class="history-back"
            onclick="closeFullHistory()">

            ‹

        </button>


        <div class="full-history-title">
            Withdrawal History
        </div>


        <div style="width:42px;"></div>

    </div>



    <!-- FULL HISTORY CONTENT -->

    <div class="full-history-content">


        <div
            class="full-history-count"
            id="historyCount">

            All Withdrawals

        </div>


        <div
            id="fullHistoryList">
        </div>


    </div>

</div>



<script>


/* ==================================================
   SETTINGS
================================================== */

let currentBalance = 12450;


/*
   Demo/local history.

   Later this can be connected
   directly with Firebase.
*/

let withdrawals =
    JSON.parse(
        localStorage.getItem(
            "globalpay_withdrawals"
        ) || "[]"
    );


/* ==================================================
   BANK / UPI
================================================== */

function showBank(){

    document.getElementById(
        "bankForm"
    ).style.display = "block";


    document.getElementById(
        "upiForm"
    ).style.display = "none";


    document.getElementById(
        "bankTab"
    ).classList.add("active");


    document.getElementById(
        "upiTab"
    ).classList.remove("active");

}


function showUPI(){

    document.getElementById(
        "bankForm"
    ).style.display = "none";


    document.getElementById(
        "upiForm"
    ).style.display = "block";


    document.getElementById(
        "bankTab"
    ).classList.remove("active");


    document.getElementById(
        "upiTab"
    ).classList.add("active");

}


/* ==================================================
   AMOUNT VALIDATION
================================================== */

function checkAmount(
    amount,
    errorId
){

    const error =
        document.getElementById(
            errorId
        );


    error.innerText = "";


    if(!amount){

        error.innerText =
            "Please enter withdrawal amount.";

        return false;
    }


    if(amount < 500){

        error.innerText =
            "Minimum withdrawal is ₹500.";

        return false;
    }


    if(amount > 50000){

        error.innerText =
            "Maximum withdrawal is ₹50,000.";

        return false;
    }


    if(amount > currentBalance){

        error.innerText =
            "Insufficient balance.";

        return false;
    }


    return true;

}


/* ==================================================
   TRANSACTION ID
================================================== */

function generateTransactionId(){

    return "GPW" +
        Date.now()
        .toString()
        .slice(-8) +

        Math.floor(
            Math.random() * 90 + 10
        );

}


/* ==================================================
   DATE / TIME
================================================== */

function getDateTime(){

    return new Date().toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* ==================================================
   BANK SUBMIT
================================================== */

function submitBank(){

    clearErrors();


    const amount =
        Number(
            document.getElementById(
                "bankAmount"
            ).value
        );


    if(
        !checkAmount(
            amount,
            "bankAmountError"
        )
    ){

        return;
    }


    const bank =
        document.getElementById(
            "bankName"
        ).value.trim();


    const holder =
        document.getElementById(
            "holderName"
        ).value.trim();


    const account =
        document.getElementById(
            "accountNo"
        ).value.trim();


    const confirm =
        document.getElementById(
            "confirmAccount"
        ).value.trim();


    const ifsc =
        document.getElementById(
            "ifsc"
        ).value
        .trim()
        .toUpperCase();


    let valid = true;


    if(bank.length < 2){

        document.getElementById(
            "bankNameError"
        ).innerText =
            "Enter valid bank name.";

        valid = false;
    }


    if(holder.length < 2){

        document.getElementById(
            "holderError"
        ).innerText =
            "Enter holder name.";

        valid = false;
    }


    if(
        !/^[0-9]{9,18}$/.test(
            account
        )
    ){

        document.getElementById(
            "accountError"
        ).innerText =
            "Enter valid account number.";

        valid = false;
    }


    if(account !== confirm){

        document.getElementById(
            "confirmError"
        ).innerText =
            "Account numbers do not match.";

        valid = false;
    }


    if(
        !/^[A-Z]{4}0[A-Z0-9]{6}$/.test(
            ifsc
        )
    ){

        document.getElementById(
            "ifscError"
        ).innerText =
            "Enter valid IFSC code.";

        valid = false;
    }


    if(!valid){

        return;
    }


    createWithdrawal({

        type:"Bank",

        amount:amount,

        bank:bank,

        holder:holder,

        account:account,

        ifsc:ifsc

    });


    document.getElementById(
        "bankAmount"
    ).value = "";

}


/* ==================================================
   UPI SUBMIT
================================================== */

function submitUPI(){

    document.getElementById(
        "upiAmountError"
    ).innerText = "";


    document.getElementById(
        "upiError"
    ).innerText = "";


    const amount =
        Number(
            document.getElementById(
                "upiAmount"
            ).value
        );


    if(
        !checkAmount(
            amount,
            "upiAmountError"
        )
    ){

        return;
    }


    const upi =
        document.getElementById(
            "upiId"
        ).value.trim();


    if(
        !/^[\w.-]+@[A-Za-z]{2,}$/.test(
            upi
        )
    ){

        document.getElementById(
            "upiError"
        ).innerText =
            "Enter a valid UPI ID.";

        return;
    }


    createWithdrawal({

        type:"UPI",

        amount:amount,

        upi:upi

    });


    document.getElementById(
        "upiAmount"
    ).value = "";

}


/* ==================================================
   CREATE WITHDRAWAL
================================================== */

function createWithdrawal(data){

    const request = {

        ...data,

        transactionId:
            generateTransactionId(),

        dateTime:
            getDateTime(),

        status:"Pending"

    };


    withdrawals.unshift(
        request
    );


    localStorage.setItem(
        "globalpay_withdrawals",
        JSON.stringify(
            withdrawals
        )
    );


    showResult(
        request
    );


    renderHistory();

}


/* ==================================================
   SHOW PENDING RESULT
================================================== */

function showResult(request){

    const result =
        request.type === "Bank"

        ? document.getElementById(
            "bankResult"
        )

        : document.getElementById(
            "upiResult"
        );


    result.style.display =
        "block";


    let html = `

        <div class="result-title">

            🟡 Withdrawal Pending

        </div>


        <div class="result-row">

            <span>
                Amount
            </span>

            <span>
                ₹${request.amount
                    .toLocaleString("en-IN")}
            </span>

        </div>


        <div class="result-row">

            <span>
                Transaction ID
            </span>

            <span>
                ${request.transactionId}
            </span>

        </div>

    `;


    if(request.type === "Bank"){

        html += `

            <div class="result-row">

                <span>
                    Account
                </span>

                <span>
                    ******${request.account.slice(-4)}
                </span>

            </div>


            <div class="result-row">

                <span>
                    IFSC
                </span>

                <span>
                    ${request.ifsc}
                </span>

            </div>


            <div class="result-row">

                <span>
                    Date & Time
                </span>

                <span>
                    ${request.dateTime}
                </span>

            </div>

        `;

    }


    if(request.type === "UPI"){

        html += `

            <div class="result-row">

                <span>
                    UPI ID
                </span>

                <span>
                    ${request.upi}
                </span>

            </div>


            <div class="result-row">

                <span>
                    Date & Time
                </span>

                <span>
                    ${request.dateTime}
                </span>

            </div>

        `;

    }


    result.innerHTML =
        html;

}


/* ==================================================
   SHORT HISTORY
================================================== */

function renderHistory(){

    const history =
        document.getElementById(
            "history"
        );


    if(withdrawals.length === 0){

        history.innerHTML = `

            <div class="empty">

                No withdrawal history yet.

            </div>

        `;

        return;
    }


    history.innerHTML =
        withdrawals
        .slice(0,4)
        .map(function(item){

            let statusClass =
                "pending";

            let statusText =
                "🕐 Pending";


            if(item.status === "Success"){

                statusClass =
                    "success";

                statusText =
                    "✓ Success";

            }


            if(item.status === "Failed"){

                statusClass =
                    "failed";

                statusText =
                    "✕ Failed";

            }


            let details = "";


            if(item.type === "Bank"){

                details = `

                    A/c:
                    ******${item.account.slice(-4)}

                    &nbsp; | &nbsp;

                    IFSC:
                    ${item.ifsc}

                `;

            }else{

                details = `

                    UPI:
                    ${item.upi}

                `;

            }


            return `

                <div class="history-card">


                    <div class="history-top">


                        <div>

                            <div class="history-method">

                                ${
                                    item.type === "Bank"

                                    ? "🏦 Bank Withdrawal"

                                    : "UPI Withdrawal"

                                }

                            </div>


                            <div class="history-amount">

                                ₹${Number(
                                    item.amount
                                ).toLocaleString(
                                    "en-IN"
                                )}

                            </div>

                        </div>


                        <div
                            class="status ${statusClass}">

                            ${statusText}

                        </div>


                    </div>


                    <div class="history-info">

                        ${details}

                        <br>

                        TXN ID:
                        ${item.transactionId}

                        &nbsp; | &nbsp;

                        ${item.dateTime}

                    </div>


                </div>

            `;

        })
        .join("");

}


/* ==================================================
   FULL HISTORY
================================================== */

function openFullHistory(){

    const page =
        document.getElementById(
            "fullHistoryPage"
        );


    const list =
        document.getElementById(
            "fullHistoryList"
        );


    const count =
        document.getElementById(
            "historyCount"
        );


    page.style.display =
        "block";


    document.body.style.overflow =
        "hidden";


    count.innerText =
        "All Withdrawals (" +
        withdrawals.length +
        ")";


    if(withdrawals.length === 0){

        list.innerHTML = `

            <div class="no-history">

                No withdrawal history yet.

            </div>

        `;

        return;
    }


    list.innerHTML =
        withdrawals
        .map(function(item){

            let statusClass =
                "full-pending";

            let statusText =
                "🕐 Pending";


            if(item.status === "Success"){

                statusClass =
                    "full-success";

                statusText =
                    "✓ Success";

            }


            if(item.status === "Failed"){

                statusClass =
                    "full-failed";

                statusText =
                    "✕ Failed";

            }


            let details = "";


            if(item.type === "Bank"){

                details = `

                    <strong>
                        Bank:
                    </strong>
                    ${item.bank}

                    <br>

                    <strong>
                        Holder:
                    </strong>
                    ${item.holder}

                    <br>

                    <strong>
                        Account:
                    </strong>
                    ******${item.account.slice(-4)}

                    <br>

                    <strong>
                        IFSC:
                    </strong>
                    ${item.ifsc}

                `;

            }else{

                details = `

                    <strong>
                        UPI ID:
                    </strong>
                    ${item.upi}

                `;

            }


            return `

                <div class="full-history-card">


                    <div class="full-history-top">


                        <div>

                            <div
                                class="full-history-method">

                                ${
                                    item.type === "Bank"

                                    ? "🏦 Bank Withdrawal"

                                    : "UPI Withdrawal"

                                }

                            </div>


                            <div
                                class="full-history-amount">

                                ₹${Number(
                                    item.amount
                                ).toLocaleString(
                                    "en-IN"
                                )}

                            </div>

                        </div>


                        <div
                            class="full-history-status ${statusClass}">

                            ${statusText}

                        </div>


                    </div>


                    <div
                        class="full-history-details">

                        ${details}

                        <br>

                        <strong>
                            Transaction ID:
                        </strong>

                        ${item.transactionId}

                        <br>

                        <strong>
                            Date & Time:
                        </strong>

                        ${item.dateTime}

                    </div>


                </div>

            `;

        })
        .join("");

}


/* ==================================================
   CLOSE FULL HISTORY
================================================== */

function closeFullHistory(){

    document.getElementById(
        "fullHistoryPage"
    ).style.display =
        "none";


    document.body.style.overflow =
        "";

}


/* ==================================================
   CLEAR ERRORS
================================================== */

function clearErrors(){

    document
        .querySelectorAll(
            ".error"
        )
        .forEach(function(el){

            el.innerText = "";

        });

}


/* ==================================================
   NAVIGATION
================================================== */

function goTo(page){

    window.location.href =
        page;

}


function goBack(){

    if(document.referrer){

        history.back();

    }else{

        window.location.href =
            "my.html";

    }

}


/* ==================================================
   START
================================================== */

renderHistory();

</script>
