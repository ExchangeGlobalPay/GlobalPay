<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Withdrawal Admin | GlobalPay</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 5%,
            rgba(0,180,255,.10),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(0,255,190,.07),
            transparent 28%
        ),
        #020914;

    color:#f4f8ff;
    min-height:100vh;
}

button{
    font-family:inherit;
}

.app{
    width:100%;
    max-width:720px;
    margin:0 auto;
    padding:20px 16px 40px;
}


/* =========================================
   HEADER
========================================= */

.header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:4px 0 20px;
    border-bottom:1px solid rgba(95,165,225,.18);
}

.home-btn,
.refresh-btn{
    width:54px;
    height:54px;
    border-radius:17px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            rgba(12,43,72,.95),
            rgba(5,25,46,.95)
        );

    border:1px solid rgba(50,160,235,.40);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 8px 25px rgba(0,0,0,.25);

    color:#8db8dd;
    cursor:pointer;
}

.home-btn svg,
.refresh-btn svg{
    width:27px;
    height:27px;
}

.header-text{
    flex:1;
    min-width:0;
}

.header-title{
    font-size:24px;
    line-height:1.1;
    font-weight:800;
    letter-spacing:-.5px;
}

.header-sub{
    margin-top:5px;
    color:#d8b45a;
    font-size:13px;
    letter-spacing:.7px;
    text-transform:uppercase;
}

.refresh-btn{
    color:#8ee0ff;
}

.refresh-btn:active,
.home-btn:active{
    transform:scale(.95);
}


/* =========================================
   HERO
========================================= */

.hero{
    margin-top:34px;
    padding:30px 28px 27px;

    border-radius:28px;

    background:
        radial-gradient(
            circle at 90% 10%,
            rgba(0,208,255,.08),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #071b30,
            #061629
        );

    border:1px solid rgba(47,154,225,.38);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04),
        0 20px 50px rgba(0,0,0,.24);
}

.hero h1{
    font-size:31px;
    line-height:1.15;
    letter-spacing:-.7px;
}

.hero p{
    color:#91abc4;
    font-size:15px;
    line-height:1.5;
    margin-top:9px;
    max-width:560px;
}


/* =========================================
   STATS
========================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:28px;
}

.stat{
    min-height:105px;
    padding:18px 15px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            rgba(8,35,59,.95),
            rgba(4,24,42,.95)
        );

    border:1px solid rgba(45,143,212,.32);

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.stat-number{
    font-size:27px;
    font-weight:800;
    line-height:1;
}

.stat-label{
    margin-top:9px;
    font-size:13px;
    color:#829bb5;
}

.stat.pending .stat-number{
    color:#ffc83d;
}

.stat.success .stat-number{
    color:#20e0a3;
}

.stat.rejected .stat-number{
    color:#ff5b72;
}


/* =========================================
   CONTROL BAR
========================================= */

.controls{
    display:flex;
    gap:12px;
    margin-top:30px;
}

.select-wrap{
    position:relative;
    flex:1;
}

select{
    width:100%;
    height:58px;
    padding:0 45px 0 18px;

    appearance:none;
    -webkit-appearance:none;

    color:#9eb8d1;

    background:
        linear-gradient(
            145deg,
            #071d34,
            #06172a
        );

    border:1px solid rgba(45,143,212,.42);
    border-radius:18px;

    outline:none;
    font-size:15px;
}

.select-arrow{
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    pointer-events:none;
    color:#86a5c1;
}

.select-arrow svg{
    width:18px;
    height:18px;
}

.refresh-main{
    height:58px;
    padding:0 25px;
    border:0;
    border-radius:18px;

    color:white;
    font-size:15px;
    font-weight:800;

    background:
        linear-gradient(
            110deg,
            #00d6aa,
            #188de9,
            #733cff
        );

    box-shadow:
        0 10px 28px rgba(0,160,255,.18);

    cursor:pointer;
}

.refresh-main:active{
    transform:scale(.97);
}


/* =========================================
   LIST
========================================= */

.list{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:22px;
}

.item{
    padding:20px;

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            rgba(7,30,51,.98),
            rgba(4,21,37,.98)
        );

    border:1px solid rgba(42,143,212,.34);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        0 12px 35px rgba(0,0,0,.18);
}

.top{
    display:flex;
    align-items:center;
    gap:13px;
}

.type-icon{
    width:48px;
    height:48px;
    flex:0 0 48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    color:#38e3c0;

    background:
        linear-gradient(
            145deg,
            rgba(0,210,175,.14),
            rgba(18,100,200,.13)
        );

    border:1px solid rgba(49,190,220,.30);
}

.type-icon svg{
    width:25px;
    height:25px;
}

.identity{
    min-width:0;
    flex:1;
}

.method{
    font-size:15px;
    font-weight:750;
}

.date{
    color:#7d98b3;
    font-size:11px;
    margin-top:5px;
}

.badge{
    flex:0 0 auto;

    padding:7px 10px;
    border-radius:20px;

    font-size:10px;
    font-weight:850;
    letter-spacing:.5px;

    color:#ffd13c;

    background:rgba(255,193,7,.12);
    border:1px solid rgba(255,193,7,.40);
}

.badge.success{
    color:#20e0a3;
    background:rgba(0,224,160,.11);
    border-color:rgba(0,224,160,.40);
}

.badge.rejected{
    color:#ff6479;
    background:rgba(255,70,100,.10);
    border-color:rgba(255,70,100,.40);
}


/* =========================================
   AMOUNT
========================================= */

.amount{
    margin-top:17px;

    font-size:26px;
    font-weight:850;

    color:#ffffff;
}


/* =========================================
   DETAILS
========================================= */

.details{
    margin-top:15px;

    border-top:1px solid rgba(70,145,200,.15);
}

.detail{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:18px;

    padding:11px 0;

    border-bottom:1px solid rgba(70,145,200,.11);
}

.detail:last-child{
    border-bottom:0;
}

.detail small{
    color:#708ba6;
    font-size:10px;
    letter-spacing:.7px;
    font-weight:700;
    flex:0 0 auto;
}

.detail span{
    color:#c8d9e9;
    font-size:12px;
    text-align:right;
    word-break:break-all;
}

.detail.tx span{
    color:#63d6ff;
}


/* =========================================
   ACTIONS
========================================= */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
}

.actions button{
    height:49px;
    border-radius:15px;

    font-size:13px;
    font-weight:800;

    cursor:pointer;
}

.approve{
    color:#001a13;
    border:0;

    background:
        linear-gradient(
            110deg,
            #00dba7,
            #25e5bd
        );

    box-shadow:
        0 8px 22px rgba(0,220,170,.13);
}

.reject{
    color:#ff7c8d;

    background:rgba(255,60,85,.08);

    border:1px solid rgba(255,65,90,.35);
}

.actions button:active{
    transform:scale(.97);
}

.note{
    margin-top:15px;
    padding:13px 15px;

    border-radius:14px;

    color:#7e99b3;
    background:rgba(10,42,69,.50);

    border:1px solid rgba(47,128,188,.20);

    font-size:12px;
    text-align:center;
}


/* =========================================
   EMPTY / LOADING
========================================= */

.empty,
.loading{
    padding:40px 22px;
    text-align:center;

    border-radius:22px;

    color:#829db8;

    background:
        linear-gradient(
            145deg,
            rgba(7,29,49,.95),
            rgba(4,21,36,.95)
        );

    border:1px solid rgba(42,132,194,.27);

    line-height:1.6;
}

.empty strong{
    color:#e8f2fc;
    font-size:16px;
}


/* =========================================
   MODAL
========================================= */

.overlay{
    position:fixed;
    inset:0;

    z-index:9999;

    display:none;
    align-items:center;
    justify-content:center;

    padding:22px;

    background:rgba(0,5,12,.82);

    backdrop-filter:blur(13px);
    -webkit-backdrop-filter:blur(13px);
}

.overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:440px;

    padding:27px;

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            #09233c,
            #06172a
        );

    border:1px solid rgba(55,156,226,.44);

    box-shadow:
        0 30px 80px rgba(0,0,0,.55);
}

.modal-icon{
    width:64px;
    height:64px;

    margin:0 auto 19px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:21px;

    color:#21e0ae;

    background:rgba(0,215,170,.11);

    border:1px solid rgba(0,220,175,.35);
}

.modal-icon svg{
    width:31px;
    height:31px;
}

.modal h2{
    text-align:center;
    font-size:23px;
}

.modal p{
    margin-top:9px;

    text-align:center;

    color:#8ca7c1;
    font-size:14px;
    line-height:1.55;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:24px;
}

.modal-actions button{
    height:51px;
    border-radius:15px;

    font-size:14px;
    font-weight:800;

    cursor:pointer;
}

.cancel{
    color:#9eb6cd;

    background:#071b2e;

    border:1px solid rgba(70,139,190,.30);
}

.confirm{
    color:#001a13;

    border:0;

    background:
        linear-gradient(
            110deg,
            #00dca9,
            #2997ec
        );
}


/* =========================================
   TOAST
========================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,20px);

    z-index:10000;

    width:calc(100% - 35px);
    max-width:440px;

    padding:14px 17px;

    border-radius:16px;

    text-align:center;

    font-size:13px;
    font-weight:700;

    color:#dffbf5;

    background:
        rgba(5,35,48,.96);

    border:1px solid rgba(0,220,175,.35);

    box-shadow:
        0 15px 40px rgba(0,0,0,.35);

    opacity:0;
    pointer-events:none;

    transition:.25s ease;
}

.toast.show{
    opacity:1;
    transform:
        translate(-50%,0);
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:520px){

    .app{
        padding:16px 12px 30px;
    }

    .hero{
        margin-top:22px;
        padding:25px 20px 22px;
        border-radius:23px;
    }

    .hero h1{
        font-size:27px;
    }

    .stats{
        gap:8px;
        margin-top:20px;
    }

    .stat{
        min-height:91px;
        padding:14px 11px;
        border-radius:16px;
    }

    .stat-number{
        font-size:23px;
    }

    .stat-label{
        font-size:11px;
        margin-top:7px;
    }

    .controls{
        margin-top:20px;
    }

    select,
    .refresh-main{
        height:53px;
    }

    .refresh-main{
        padding:0 17px;
    }

    .item{
        padding:16px;
        border-radius:20px;
    }

    .amount{
        font-size:23px;
    }

    .badge{
        font-size:9px;
        padding:6px 8px;
    }

    .detail{
        gap:10px;
    }

    .detail span{
        max-width:65%;
    }

}

@media(max-width:370px){

    .header-title{
        font-size:21px;
    }

    .header-sub{
        font-size:11px;
    }

    .home-btn,
    .refresh-btn{
        width:48px;
        height:48px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .stat{
        min-height:72px;
    }

    .actions{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>

<div class="app">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

        <button
            class="home-btn"
            id="homeBtn"
            aria-label="Go to admin home">

            <svg viewBox="0 0 24 24" fill="none">

                <path
                    d="M3 10.5 12 3l9 7.5"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

                <path
                    d="M5.5 9.5V21h13V9.5"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linejoin="round"/>

                <path
                    d="M9 21v-6h6v6"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linejoin="round"/>

            </svg>

        </button>


        <div class="header-text">

            <div class="header-title">
                Withdrawal Admin
            </div>

            <div class="header-sub">
                GlobalPay Admin Panel
            </div>

        </div>


        <button
            class="refresh-btn"
            id="reloadBtn"
            aria-label="Refresh">

            <svg viewBox="0 0 24 24" fill="none">

                <path
                    d="M20 11a8 8 0 0 0-14.7-4.2L4 9"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

                <path
                    d="M4 5v4h4"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

                <path
                    d="M4 13a8 8 0 0 0 14.7 4.2L20 15"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

                <path
                    d="M20 19v-4h-4"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

            </svg>

        </button>

    </header>



    <!-- =====================================
         HERO
    ====================================== -->

    <section class="hero">

        <h1>
            Withdrawal Requests
        </h1>

        <p>
            Review withdrawal requests and approve
            or reject them securely.
        </p>


        <div class="stats">

            <div class="stat pending">

                <div
                    class="stat-number"
                    id="pendingCount">
                    0
                </div>

                <div class="stat-label">
                    Pending
                </div>

            </div>


            <div class="stat success">

                <div
                    class="stat-number"
                    id="successCount">
                    0
                </div>

                <div class="stat-label">
                    Approved
                </div>

            </div>


            <div class="stat rejected">

                <div
                    class="stat-number"
                    id="rejectedCount">
                    0
                </div>

                <div class="stat-label">
                    Rejected
                </div>

            </div>

        </div>

    </section>



    <!-- =====================================
         FILTER
    ====================================== -->

    <div class="controls">

        <div class="select-wrap">

            <select id="filter">

                <option value="Pending">
                    Pending Requests
                </option>

                <option value="All">
                    All Requests
                </option>

                <option value="Success">
                    Approved / Success
                </option>

                <option value="Rejected">
                    Rejected
                </option>

            </select>


            <div class="select-arrow">

                <svg viewBox="0 0 24 24" fill="none">

                    <path
                        d="m6 9 6 6 6-6"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                </svg>

            </div>

        </div>


        <button
            class="refresh-main"
            id="refreshBtn">

            Refresh

        </button>

    </div>



    <!-- =====================================
         REQUEST LIST
    ====================================== -->

    <main
        class="list"
        id="list">

        <div class="loading">
            Loading withdrawal requests...
        </div>

    </main>

</div>



<!-- =========================================
     CONFIRM MODAL
========================================== -->

<div
    class="overlay"
    id="confirmOverlay">

    <div class="modal">

        <div class="modal-icon">

            <svg
                viewBox="0 0 24 24"
                fill="none">

                <path
                    d="M20 6 9 17l-5-5"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

            </svg>

        </div>


        <h2 id="confirmTitle">
            Approve Withdrawal?
        </h2>


        <p id="confirmText">
            This will mark the withdrawal as
            SUCCESS for the user.
        </p>


        <div class="modal-actions">

            <button
                class="cancel"
                id="cancelBtn">

                Cancel

            </button>


            <button
                class="confirm"
                id="confirmBtn"
                data-status="Success">

                Approve &amp; Success

            </button>

        </div>

    </div>

</div>



<!-- =========================================
     TOAST
========================================== -->

<div
    class="toast"
    id="toast">
</div>



<!-- =========================================
     FIREBASE
========================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCA6cs0T8NBPNwOyA269hOfdgmt9DYDoqQ",

    authDomain:
        "globalpay-d31dd.firebaseapp.com",

    projectId:
        "globalpay-d31dd",

    storageBucket:
        "globalpay-d31dd.firebasestorage.app",

    messagingSenderId:
        "862227027913",

    appId:
        "1:862227027913:web:f643dc5cb4b014fd80ba18"

};


/* =========================================
   ADMIN UID
========================================= */

const ADMIN_UID =
    "mzpruXJakRhQmvF6rhqS9653UNU2";


/* =========================================
   FIREBASE INITIALIZE
========================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;

let allWithdrawals = [];

let selectedWithdrawal = null;


/* =========================================
   SHORT SELECTOR
========================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================
   MONEY FORMAT
========================================= */

function money(amount){

    return "₹" +
        Number(amount || 0).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =========================================
   NORMALIZE STATUS
========================================= */

function getStatus(status){

    const s =
        String(status || "Pending")
        .trim()
        .toLowerCase();


    if(
        s === "success" ||
        s === "successful" ||
        s === "approved" ||
        s === "completed"
    ){

        return "Success";

    }


    if(
        s === "rejected" ||
        s === "failed" ||
        s === "cancelled" ||
        s === "canceled"
    ){

        return "Rejected";

    }


    return "Pending";

}


/* =========================================
   DATE
========================================= */

function formatDate(timestamp){

    try{

        if(!timestamp)
            return "Just now";


        const date =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(timestamp);


        return date.toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "Just now";

    }

}


/* =========================================
   AUTH PERSISTENCE
========================================= */

setPersistence(
    auth,
    browserLocalPersistence
).catch(error => {

    console.error(
        "Persistence error:",
        error
    );

});


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        currentUser = user;


        if(!user){

            $("list").innerHTML = `
                <div class="empty">

                    <strong>
                        Admin Login Required
                    </strong>

                    <br>

                    Please login with the
                    authorized admin account.

                </div>
            `;

            return;

        }


        if(user.uid !== ADMIN_UID){

            $("list").innerHTML = `
                <div class="empty">

                    <strong>
                        Access Denied
                    </strong>

                    <br>

                    This account is not authorized
                    to access the admin panel.

                </div>
            `;

            return;

        }


        await loadWithdrawals();

    }
);


/* =========================================
   LOAD WITHDRAWALS
========================================= */

async function loadWithdrawals(){

    $("list").innerHTML = `
        <div class="loading">
            Loading withdrawal requests...
        </div>
    `;


    try{

        /*
         Read all users first.
         Then read each user's withdrawals.
        */

        const usersSnapshot =
            await getDocs(
                collection(
                    db,
                    "users"
                )
            );


        const result = [];


        for(
            const userDoc
            of usersSnapshot.docs
        ){

            const uid =
                userDoc.id;


            const withdrawalRef =
                collection(
                    db,
                    "users",
                    uid,
                    "withdrawals"
                );


            const withdrawalSnapshot =
                await getDocs(
                    withdrawalRef
                );


            withdrawalSnapshot.forEach(
                withdrawalDoc => {

                    result.push({

                        id:
                            withdrawalDoc.id,

                        ref:
                            withdrawalDoc.ref,

                        uid:
                            uid,

                        ...withdrawalDoc.data()

                    });

                }
            );

        }


        result.sort(
            (a,b) => {

                const aTime =
                    a.createdAt?.seconds || 0;

                const bTime =
                    b.createdAt?.seconds || 0;

                return bTime - aTime;

            }
        );


        allWithdrawals =
            result;


        updateCounters();

        renderWithdrawals();


    }catch(error){

        console.error(
            "LOAD WITHDRAWALS ERROR:",
            error
        );


        $("list").innerHTML = `

            <div class="empty">

                <strong>
                    Unable to load withdrawals
                </strong>

                <br><br>

                ${error.code || "Firestore error"}

                <br><br>

                Check your Firestore
                withdrawal rules.

            </div>

        `;

    }

}


/* =========================================
   COUNTERS
========================================= */

function updateCounters(){

    $("pendingCount").textContent =
        allWithdrawals.filter(
            item =>
                getStatus(item.status)
                === "Pending"
        ).length;


    $("successCount").textContent =
        allWithdrawals.filter(
            item =>
                getStatus(item.status)
                === "Success"
        ).length;


    $("rejectedCount").textContent =
        allWithdrawals.filter(
            item =>
                getStatus(item.status)
                === "Rejected"
        ).length;

}


/* =========================================
   ICON
========================================= */

function withdrawalIcon(type){

    if(
        String(type || "").toUpperCase()
        === "UPI"
    ){

        return `

        <svg
            viewBox="0 0 24 24"
            fill="none">

            <path
                d="M7 3h5l-4 7h5l-7 11 2-8H4l3-10Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"/>

        </svg>

        `;

    }


    return `

    <svg
        viewBox="0 0 24 24"
        fill="none">

        <path
            d="m3 9 9-5 9 5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        <path
            d="M5 10v8
               M9 10v8
               M15 10v8
               M19 10v8"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

        <path
            d="M3 20h18"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

    </svg>

    `;

}


/* =========================================
   RENDER WITHDRAWALS
========================================= */

function renderWithdrawals(){

    const filter =
        $("filter").value;


    let list =
        allWithdrawals;


    if(filter !== "All"){

        list =
            allWithdrawals.filter(
                item =>
                    getStatus(item.status)
                    === filter
            );

    }


    if(!list.length){

        $("list").innerHTML = `

            <div class="empty">

                <strong>
                    No withdrawal requests
                </strong>

                <br>

                No ${filter.toLowerCase()}
                withdrawal requests found.

            </div>

        `;

        return;

    }


    $("list").innerHTML =
        list.map(item => {


            const status =
                getStatus(item.status);


            let statusClass = "";


            if(status === "Success")
                statusClass = "success";


            if(status === "Rejected")
                statusClass = "rejected";


            const account =
                item.accountNumber
                    ? "••••••" +
                      String(
                          item.accountNumber
                      ).slice(-4)
                    : "—";


            const isUPI =
                String(item.type || "")
                .toUpperCase() === "UPI";


            const destination =
                isUPI
                    ? item.upiId || "—"
                    : item.bankName || "—";


            const index =
                allWithdrawals.indexOf(item);


            let actions = "";


            if(status === "Pending"){

                actions = `

                    <div class="actions">

                        <button
                            class="approve"
                            data-index="${index}"
                            data-action="approve">

                            Approve &amp; Success

                        </button>


                        <button
                            class="reject"
                            data-index="${index}"
                            data-action="reject">

                            Reject

                        </button>

                    </div>

                `;

            }else{

                actions = `

                    <div class="note">

                        Withdrawal is already
                        ${status.toLowerCase()}.

                    </div>

                `;

            }


            return `

            <article class="item">


                <div class="top">


                    <div class="type-icon">

                        ${withdrawalIcon(item.type)}

                    </div>


                    <div class="identity">

                        <div class="method">

                            ${
                                isUPI
                                    ? "UPI Withdrawal"
                                    : "Bank Withdrawal"
                            }

                        </div>


                        <div class="date">

                            ${formatDate(item.createdAt)}

                        </div>

                    </div>


                    <span
                        class="badge ${statusClass}">

                        ${status.toUpperCase()}

                    </span>


                </div>


                <div class="amount">

                    ${money(item.amount)}

                </div>


                <div class="details">


                    <div class="detail">

                        <small>
                            USER UID
                        </small>

                        <span>
                            ${item.uid || "—"}
                        </span>

                    </div>


                    ${
                        isUPI

                        ? `

                        <div class="detail">

                            <small>
                                UPI ID
                            </small>

                            <span>
                                ${item.upiId || "—"}
                            </span>

                        </div>

                        `

                        :

                        `

                        <div class="detail">

                            <small>
                                BANK
                            </small>

                            <span>
                                ${item.bankName || "—"}
                            </span>

                        </div>


                        <div class="detail">

                            <small>
                                HOLDER
                            </small>

                            <span>
                                ${item.holderName || "—"}
                            </span>

                        </div>


                        <div class="detail">

                            <small>
                                ACCOUNT
                            </small>

                            <span>
                                ${account}
                            </span>

                        </div>


                        <div class="detail">

                            <small>
                                IFSC
                            </small>

                            <span>
                                ${item.ifsc || "—"}
                            </span>

                        </div>

                        `
                    }


                    <div class="detail tx">

                        <small>
                            TRANSACTION ID
                        </small>

                        <span>
                            ${item.transactionId || "—"}
                        </span>

                    </div>


                    ${
                        item.email

                        ? `

                        <div class="detail">

                            <small>
                                EMAIL
                            </small>

                            <span>
                                ${item.email}
                            </span>

                        </div>

                        `

                        : ""
                    }


                </div>


                ${actions}


            </article>

            `;

        }).join("");

}


/* =========================================
   ACTION BUTTON
========================================= */

$("list").addEventListener(
    "click",
    event => {


        const button =
            event.target.closest(
                "button[data-action]"
            );


        if(!button)
            return;


        const index =
            Number(
                button.dataset.index
            );


        selectedWithdrawal =
            allWithdrawals[index];


        if(!selectedWithdrawal)
            return;


        const isApprove =
            button.dataset.action
            === "approve";


        $("confirmTitle")
            .textContent =
            isApprove
                ? "Approve Withdrawal?"
                : "Reject Withdrawal?";


        $("confirmText")
            .textContent =
            isApprove

                ? "This will mark the withdrawal as SUCCESS for the user."

                : "This will mark the withdrawal as REJECTED for the user.";


        $("confirmBtn")
            .textContent =
            isApprove
                ? "Approve & Success"
                : "Reject Request";


        $("confirmBtn")
            .dataset.status =
            isApprove
                ? "Success"
                : "Rejected";


        $("confirmOverlay")
            .classList
            .add("show");

    }
);


/* =========================================
   CANCEL MODAL
========================================= */

$("cancelBtn").onclick = () => {

    $("confirmOverlay")
        .classList
        .remove("show");


    selectedWithdrawal =
        null;

};


/* =========================================
   CONFIRM UPDATE
========================================= */

$("confirmBtn").onclick =
    async () => {


        if(
            !selectedWithdrawal ||
            !currentUser ||
            currentUser.uid !== ADMIN_UID
        ){

            showToast(
                "Admin authorization required."
            );

            return;

        }


        const newStatus =
            $("confirmBtn")
            .dataset.status;


        const button =
            $("confirmBtn");


        button.disabled =
            true;


        button.textContent =
            "Updating...";


        try{


            await updateDoc(
                selectedWithdrawal.ref,
                {

                    status:
                        newStatus,

                    updatedAt:
                        serverTimestamp()

                }
            );


            $("confirmOverlay")
                .classList
                .remove("show");


            showToast(

                newStatus === "Success"

                    ? "Withdrawal approved successfully."

                    : "Withdrawal rejected successfully."

            );


            selectedWithdrawal =
                null;


            await loadWithdrawals();


        }catch(error){

            console.error(
                "UPDATE ERROR:",
                error
            );


            $("confirmOverlay")
                .classList
                .remove("show");


            if(
                error.code ===
                "permission-denied"
            ){

                showToast(
                    "Permission denied. Check Firestore rules."
                );

            }else{

                showToast(
                    "Unable to update withdrawal."
                );

            }

        }


        button.disabled =
            false;


        button.textContent =
            newStatus === "Success"
                ? "Approve & Success"
                : "Reject Request";

    };


/* =========================================
   FILTER
========================================= */

$("filter").onchange =
    () => {

        renderWithdrawals();

    };


/* =========================================
   REFRESH
========================================= */

$("refreshBtn").onclick =
    () => {

        loadWithdrawals();

    };


$("reloadBtn").onclick =
    () => {

        loadWithdrawals();

    };


/* =========================================
   HOME
========================================= */

$("homeBtn").onclick =
    () => {

        window.location.href =
            "my.html";

    };


/* =========================================
   TOAST
========================================= */

function showToast(message){

    const toast =
        $("toast");


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2800
    );

}

</script>
