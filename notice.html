<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications - GlobalPay</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#fffdfb;
    color:#172033;
    min-height:100vh;
}

/* Subtle Background Grid */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(20,35,55,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(20,35,55,.025) 1px,transparent 1px);
    background-size:41px 41px;
}

/* Header */
.header{
    height:70px;
    width:100%;
    max-width:650px;
    margin:auto;
    padding:0 16px;
    display:flex;
    align-items:center;
    gap:14px;
    background:rgba(255,253,251,.92);
    border-bottom:1px solid #eef0f3;
}

.back-btn{
    width:42px;
    height:42px;
    border:1px solid #e9edf2;
    border-radius:13px;
    background:#fff;
    color:#172033;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(15,23,42,.06);
    transition:.2s ease;
}

.back-btn:active{
    transform:scale(.95);
}

.back-btn svg{
    width:20px;
    height:20px;
}

.header-title{
    flex:1;
}

.header-title h1{
    font-size:20px;
    font-weight:750;
    letter-spacing:-.3px;
}

.header-title p{
    margin-top:2px;
    font-size:12px;
    color:#8a94a6;
}

/* Main */
.main{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:24px 14px 40px;
}

/* Empty State */
.empty-card{
    min-height:calc(100vh - 135px);
    display:flex;
    align-items:center;
    justify-content:center;
}

.empty-content{
    width:100%;
    text-align:center;
    padding:30px 20px;
}

.empty-icon{
    width:86px;
    height:86px;
    margin:0 auto 20px;
    border-radius:25px;
    background:linear-gradient(145deg,#fff5e9,#fff);
    border:1px solid #f4e5d5;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#e87512;
    box-shadow:
        0 14px 35px rgba(232,117,18,.10),
        inset 0 1px 0 rgba(255,255,255,.8);
}

.empty-icon svg{
    width:38px;
    height:38px;
}

.empty-content h2{
    font-size:21px;
    font-weight:750;
    color:#172033;
    margin-bottom:8px;
}

.empty-content p{
    max-width:290px;
    margin:auto;
    font-size:13px;
    line-height:1.6;
    color:#8a94a6;
}

/* Bottom spacing */
@media(max-width:420px){
    .header{
        height:66px;
    }

    .header-title h1{
        font-size:18px;
    }

    .main{
        padding-left:12px;
        padding-right:12px;
    }

    .empty-icon{
        width:78px;
        height:78px;
        border-radius:23px;
    }

    .empty-content h2{
        font-size:20px;
    }
}
</style>
</head>

<body>

<!-- Header -->
<header class="header">

    <button class="back-btn"
            onclick="window.location.href='my.html'"
            aria-label="Back">

        <svg viewBox="0 0 24 24"
             fill="none"
             xmlns="http://www.w3.org/2000/svg">

            <path d="M15 18L9 12L15 6"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
        </svg>

    </button>

    <div class="header-title">
        <h1>Notifications</h1>
        <p>Important updates and messages</p>
    </div>

</header>


<!-- Main -->
<main class="main">

    <section class="empty-card">

        <div class="empty-content">

            <div class="empty-icon">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg">

                    <path d="M18 8C18 4.686 15.314 2 12 2C8.686 2 6 4.686 6 8C6 14 3.5 16 3.5 18H20.5C20.5 16 18 14 18 8Z"
                          stroke="currentColor"
                          stroke-width="1.7"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>

                    <path d="M9.5 21C10.1 21.65 11 22 12 22C13 22 13.9 21.65 14.5 21"
                          stroke="currentColor"
                          stroke-width="1.7"
                          stroke-linecap="round"/>

                </svg>

            </div>

            <h2>No Message</h2>

            <p>
                You don't have any new notifications or messages at the moment.
            </p>

        </div>

    </section>

</main>

</body>
</html>
